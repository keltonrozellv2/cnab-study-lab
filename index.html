     ["SSH port forwarding can only carry HTTP traffic.","It carries any TCP stream."],
     ["A certificate contains the server's private key so clients can decrypt traffic.","Certificates carry the public key; the private key never leaves the server."]]},
 wireless:{area:"net",cat:"Wireless",topic:"wireless networking",
  T:[["WPA2 uses AES-CCMP; WEP uses RC4 and is trivially cracked.","WEP keys can be recovered in minutes from captured IVs."],
     ["The WPA2 four-way handshake derives the session keys from the pre-shared key.","Capturing it lets an attacker brute-force the passphrase offline."],
     ["A deauthentication frame can be spoofed to kick a client off a network.","Attackers use it to force a reconnect and capture the handshake."],
     ["Monitor mode lets a wireless card capture all 802.11 frames, not just those addressed to it.","Needed for tools like airodump-ng."],
     ["2.4 GHz has longer range but fewer non-overlapping channels than 5 GHz.","Channels 1, 6 and 11 are the non-overlapping set on 2.4 GHz."],
     ["The SSID is the network's name; hiding it does not make the network secure.","Probe requests and beacons still leak it."],
     ["802.11 uses CSMA/CA because radios cannot detect collisions while transmitting.","Wired Ethernet uses CSMA/CD."],
     ["WPA3 adds SAE, which protects against offline dictionary attacks on the passphrase.","Simultaneous Authentication of Equals replaces the PSK handshake."],
     ["An evil twin is a rogue access point that imitates a legitimate SSID.","Clients connect to it and the attacker intercepts traffic."],
     ["MAC filtering is weak because client MAC addresses can be sniffed and spoofed.","It is a nuisance to attackers, not a security control."],
     ["Beacon frames are sent by access points to advertise the network.","They carry the SSID, supported rates and security capabilities."],
     ["Enterprise WPA2 uses 802.1X with a RADIUS server instead of a shared passphrase.","Each user authenticates with their own credentials or certificate."]],
  F:[["WEP is considered secure as long as a long key is used.","WEP's RC4/IV design is broken regardless of key length."],
     ["Hiding the SSID prevents attackers from discovering the network.","Probes and association frames still reveal it."],
     ["Monitor mode only captures frames addressed to the capturing card.","That is normal managed mode; monitor mode captures everything."],
     ["5 GHz travels further through walls than 2.4 GHz.","Higher frequencies attenuate faster; 2.4 GHz has the longer range."],
     ["Wireless uses CSMA/CD just like wired Ethernet.","Wireless uses CSMA/CA; radios cannot detect collisions."],
     ["A deauth frame can only be sent by the legitimate access point.","Management frames are unauthenticated in WPA2 by default, so anyone can spoof them."],
     ["MAC filtering stops any device not on the list from ever connecting.","An attacker can spoof an allowed MAC."],
     ["WPA2-Enterprise uses one shared passphrase for all users.","Enterprise uses 802.1X per-user authentication; Personal uses a PSK."],
     ["Capturing the WPA2 handshake gives the attacker the plaintext passphrase directly.","It gives material for an offline brute-force, not the passphrase itself."],
     ["2.4 GHz channels 1, 2 and 3 do not overlap.","Non-overlapping 2.4 GHz channels are 1, 6 and 11."],
     ["An evil twin attack requires physical access to the real access point.","It just needs a rogue AP broadcasting the same SSID."],
     ["WPA3 removed encryption to improve speed.","WPA3 strengthens security with SAE and forward secrecy."]]},
 auth:{area:"os",cat:"Authentication",topic:"authentication, hashing and signing",
  T:[["Windows stores local password hashes in the SAM database, protected by the SYSTEM hive key.","Dumping SAM + SYSTEM yields NTLM hashes."],
     ["NTLM hashes can be used in pass-the-hash attacks without knowing the password.","That is why password hashes are treated as secrets."],
     ["Kerberos issues tickets from a Key Distribution Center so clients can prove identity to services.","TGT first, then service tickets; the KDC runs on domain controllers."],
     ["A salt makes identical passwords hash to different values.","It defeats precomputed rainbow tables."],
     ["Multi-factor authentication combines something you know, have, or are.","A password plus a hardware token is two factors; two passwords is one."],
     ["Code signing lets the OS verify that an executable has not been modified since the publisher signed it.","Authenticode on Windows; the signature covers a hash of the file."],
     ["Hashing is one-way; encryption is reversible with the key.","Passwords are hashed, data is encrypted."],
     ["Logon type 3 in Windows security logs is a network logon, such as accessing a share.","Type 2 is interactive, type 10 is RemoteInteractive (RDP)."],
     ["An expired or revoked certificate should fail signature validation.","Revocation is checked via CRL or OCSP."],
     ["Local accounts have a RID of 500 for the built-in Administrator.","The RID is the last part of the SID; 500 = Administrator, 501 = Guest."],
     ["Account lockout policies limit brute-force attempts against passwords.","After N failures the account is locked for a period."],
     ["Single sign-on lets one authentication grant access to multiple services.","Kerberos in a domain is a classic SSO system."]],
  F:[["Windows stores local passwords in plaintext in the registry.","It stores hashes in the SAM, not plaintext."],
     ["An attacker needs the plaintext password to perform pass-the-hash.","The hash itself is sufficient — that is the point of the attack."],
     ["A salt is a secret key used to encrypt the password hash.","A salt is random public data mixed in before hashing to defeat precomputation."],
     ["Two different passwords count as multi-factor authentication.","Both are 'something you know' — one factor."],
     ["Code signing encrypts the executable so it cannot be read.","Signing proves origin and integrity; it does not encrypt."],
     ["Hashing can be reversed with the correct key.","Hashing has no key and is one-way; encryption is reversible."],
     ["Kerberos sends the user's password to every service in the clear.","Kerberos uses tickets; the password never travels to services."],
     ["Logon type 2 means a network logon to a file share.","Type 2 is interactive (console); type 3 is network."],
     ["The built-in Administrator account always has RID 1000.","Administrator is RID 500; 1000+ are normal user accounts."],
     ["A revoked certificate remains valid until its expiry date.","Revocation invalidates it immediately once checked via CRL/OCSP."],
     ["Account lockout prevents pass-the-hash attacks.","Lockout limits password guessing; it does nothing against a stolen hash."],
     ["Single sign-on means every service has its own separate password.","SSO is one login for many services."]]},
 av:{area:"os",cat:"Antivirus & integrity",topic:"antivirus and file integrity",
  T:[["Signature-based antivirus matches known patterns and misses brand-new malware.","Zero-days have no signature yet."],
     ["Heuristic and behavioural detection look at what a program does rather than what it looks like.","They can catch unknown variants at the cost of false positives."],
     ["A file hash (SHA-256) changes completely if even one byte of the file changes.","That is why hashes are used for integrity checks and IOC matching."],
     ["Packing or obfuscating malware changes its hash and can evade signature scans.","The unpacked payload in memory is still detectable by behaviour."],
     ["File integrity monitoring alerts when protected system files change unexpectedly.","Tripwire-style tools baseline hashes and compare."],
     ["Windows Defender can be queried and configured from PowerShell (Get-MpComputerStatus).","Useful on servers with no GUI."],
     ["Quarantine moves a suspicious file to an isolated store instead of deleting it.","Analysts can restore or submit it."],
     ["A false positive is a benign file flagged as malicious; a false negative is malware missed.","Tuning trades one against the other."],
     ["Two files with the same SHA-256 hash are, for practical purposes, identical.","Collisions in SHA-256 are computationally infeasible."],
     ["Antivirus signature databases must be updated regularly to stay effective.","Stale signatures miss recent campaigns."],
     ["Sandboxing runs a suspicious file in an isolated environment to observe its behaviour.","Malware often checks for sandboxes and stays dormant."],
     ["MD5 is still used for file identification but is unsuitable for security because collisions are easy.","Use SHA-256 for anything security-relevant."]],
  F:[["Signature-based antivirus reliably detects brand-new malware.","New malware has no signature; heuristics are needed."],
     ["Changing one byte of a file leaves its hash unchanged.","Any change produces a completely different digest."],
     ["Packing malware makes it easier for signature scanners to detect.","Packing hides the payload and changes the hash, evading signatures."],
     ["A false negative is a clean file wrongly flagged as malware.","That is a false positive; a false negative is malware that was missed."],
     ["Quarantine permanently deletes the file.","Quarantine isolates it; deletion is a separate action."],
     ["Antivirus signatures never need updating once installed.","Databases are updated constantly."],
     ["Two different files can never have the same MD5 hash.","MD5 collisions are practical today; that is why it is deprecated for security."],
     ["Behavioural detection only works on malware already in the signature database.","Behavioural detection is exactly for unknown samples."],
     ["File integrity monitoring blocks all file changes on the system.","It detects and alerts on changes; it does not block them."],
     ["Sandboxing runs malware directly on the production host to see what it does.","Sandboxes are isolated environments."],
     ["SHA-256 is considered broken and should be replaced by MD5.","It is the reverse: MD5 is broken, SHA-256 is current practice."],
     ["Windows Defender cannot be managed from the command line.","PowerShell's Defender cmdlets manage it fully."]]},
 cloud:{area:"os",cat:"Cloud & mobile",topic:"cloud, containers and mobile",
  T:[["IaaS gives you virtual machines and networks; you manage the OS and everything above it.","Example: EC2, Azure VMs."],
     ["PaaS provides a managed runtime; you deploy code and the provider manages the OS and middleware.","Example: App Engine, Azure App Service."],
     ["SaaS is a complete application delivered over the internet.","Example: Microsoft 365, Gmail."],
     ["A private cloud is dedicated to one organisation; a public cloud is shared infrastructure.","Hybrid combines both."],
     ["Containers share the host kernel and start in seconds; VMs boot a full OS.","Docker images are layers on top of a base image."],
     ["Container images should be scanned for vulnerable packages before deployment.","A vulnerable base image is inherited by everything built on it."],
     ["Full-disk encryption on a mobile device protects data at rest if the device is lost.","The key is derived from the passcode and hardware-backed keystore."],
     ["Mobile device management (MDM) lets an organisation enforce policy and wipe lost devices.","Remote wipe, passcode rules, app allow-lists."],
     ["Sideloading apps from outside the official store increases malware risk.","Store review and signing checks are bypassed."],
     ["Hypervisor logs should be collected centrally because a compromised VM cannot be trusted to log itself.","Log forwarding to a SIEM preserves evidence."],
     ["In the shared-responsibility model the provider secures the infrastructure; the customer secures their data and configuration.","Misconfigured storage buckets are a customer-side failure."],
     ["Jailbreaking or rooting a phone removes OS security controls and sandboxing.","Apps can then access data they should not."]],
  F:[["With IaaS the provider patches your guest operating system for you.","In IaaS you manage the OS; the provider manages the physical hosts."],
     ["SaaS requires you to install and maintain the application server yourself.","SaaS is fully managed; you just use the application."],
     ["Containers each boot their own full operating system kernel.","Containers share the host kernel; VMs have their own."],
     ["A public cloud is infrastructure dedicated to a single organisation.","That is a private cloud."],
     ["Full-disk encryption protects data while it is being transmitted over Wi-Fi.","It protects data at rest; TLS/VPN protect data in transit."],
     ["Sideloading apps is safer than using the official store.","Sideloading skips store review and is a major malware vector."],
     ["In the shared-responsibility model the cloud provider is responsible for your data's permissions.","Customers own their data, identities and configuration."],
     ["Rooting a phone improves its security by giving the user more control.","Rooting removes sandboxing and OS protections."],
     ["MDM can only be used to install apps, not to wipe a device.","Remote wipe is a core MDM capability."],
     ["Logs from a compromised VM are fully trustworthy if read from inside the VM.","Attackers can alter local logs; forward them centrally."],
     ["PaaS means you must manage the hypervisor and physical servers.","The provider manages those; you deploy code."],
     ["Scanning container images is unnecessary because containers are isolated.","Vulnerable packages in the image are still exploitable."]]},
 malware:{area:"sec",cat:"Malware & rootkits",topic:"malware classes and rootkits",
  T:[["A virus needs a host file and user action to spread; a worm spreads on its own across the network.","Worms exploit services (e.g., SMB) without user help."],
     ["A trojan disguises itself as legitimate software to get the user to run it.","It does not self-replicate."],
     ["A rootkit hides its presence by hooking or modifying the OS, often in kernel mode.","Hidden processes, files and network connections are classic signs."],
     ["Ransomware encrypts files and demands payment for the key.","Offline backups are the main defence."],
     ["A botnet is a group of compromised machines controlled through a command-and-control channel.","C2 often uses HTTP, DNS or IRC to blend in."],
     ["A NOP sled is a run of no-op instructions that lets an exploit jump imprecisely and still reach the shellcode.","0x90 on x86."],
     ["Shellcode is the small machine-code payload an exploit runs after taking control.","Often spawns a shell, hence the name."],
     ["Spyware collects information such as keystrokes or browsing without consent.","Keyloggers are a subclass."],
     ["A logic bomb lies dormant until a trigger condition such as a date or event.","Often planted by insiders."],
     ["Fileless malware runs in memory using legitimate tools such as PowerShell or WMI.","Little or nothing lands on disk, so file-based AV misses it."],
     ["A bootkit infects the boot process so it loads before the operating system's defences.","Secure Boot is the main counter."],
     ["Polymorphic malware changes its code each infection to evade signature detection.","The behaviour stays the same; the bytes change."]],
  F:[["A worm requires the user to open an infected file to spread.","Worms spread autonomously; viruses need a host and user action."],
     ["A trojan replicates itself across the network without user action.","Trojans rely on deception; they do not self-replicate."],
     ["A rootkit is any program that runs with the root password.","A rootkit's defining feature is hiding its presence by modifying the OS."],
     ["Ransomware steals passwords and sends them to the attacker.","Ransomware encrypts data for ransom; password theft is spyware/infostealers."],
     ["A botnet is a network of honeypots used by defenders.","A botnet is attacker-controlled compromised machines."],
     ["A NOP sled is the encrypted part of the payload.","It is a pad of do-nothing instructions leading to the shellcode."],
     ["Shellcode is a Bash script that automates installs.","Shellcode is raw machine code injected by an exploit."],
     ["A logic bomb activates immediately on installation.","It waits for a trigger condition."],
     ["Fileless malware is easy to catch with file-hash scanning.","It runs in memory; there may be no file to hash."],
     ["Polymorphic malware keeps identical bytes on every infection.","It mutates its code to evade signatures."],
     ["A bootkit runs only after the user logs in.","It runs during boot, before the OS and its defences load."],
     ["Spyware is a tool that encrypts the disk for the user's protection.","Spyware secretly collects information."]]},
 pki:{area:"sec",cat:"Crypto & PKI",topic:"cryptography and PKI",
  T:[["Symmetric encryption uses one shared key; asymmetric uses a public/private key pair.","AES is symmetric; RSA and ECC are asymmetric."],
     ["Data encrypted with a public key can only be decrypted with the matching private key.","That gives confidentiality to the key owner."],
     ["A digital signature is created with the private key and verified with the public key.","It proves origin and integrity."],
     ["A certificate authority signs certificates so others can trust the public key inside.","Trust chains up to a root CA in the trust store."],
     ["A CRL or OCSP responder is used to check whether a certificate has been revoked.","Revocation matters when a private key is compromised."],
     ["Hashing provides integrity, encryption provides confidentiality, signatures provide authenticity and non-repudiation.","The CIA-plus-non-repudiation mapping."],
     ["AES-256 is a symmetric block cipher widely used for data at rest and in transit.","Fast and hardware-accelerated."],
     ["Diffie-Hellman lets two parties agree a shared secret over an untrusted channel.","Neither side ever transmits the secret itself."],
     ["Perfect forward secrecy means a compromised long-term key does not expose past session keys.","Ephemeral DH (DHE/ECDHE) provides it."],
     ["Secure email with S/MIME or PGP signs and/or encrypts the message using certificates or key pairs.","The recipient's public key encrypts; the sender's private key signs."],
     ["MFA with a hardware token resists phishing better than SMS codes.","SMS can be intercepted or SIM-swapped."],
     ["Key length in bits is a rough measure of brute-force resistance; asymmetric keys must be much longer than symmetric keys for similar strength.","RSA-2048 ≈ AES-112 security; ECC achieves similar strength with shorter keys."]],
  F:[["Asymmetric encryption uses one shared secret key for both directions.","That is symmetric; asymmetric uses a key pair."],
     ["Data encrypted with a public key is decrypted with the same public key.","It is decrypted with the private key."],
     ["A digital signature is created with the public key.","Signing uses the private key; verification uses the public key."],
     ["A certificate authority keeps a copy of every user's private key.","CAs sign public keys; private keys stay with the owner."],
     ["A revoked certificate stays valid until it expires.","Revocation takes effect once published and checked."],
     ["Encryption guarantees integrity and hashing guarantees confidentiality.","Reversed: encryption → confidentiality, hashing → integrity."],
     ["AES is an asymmetric algorithm.","AES is symmetric; RSA/ECC are asymmetric."],
     ["Diffie-Hellman transmits the shared secret in the clear so both sides have it.","The secret is derived; it is never sent."],
     ["Perfect forward secrecy means the same session key is reused forever.","It means each session uses an ephemeral key, protecting past sessions."],
     ["To send someone an encrypted email you encrypt it with your own private key.","You encrypt with the recipient's public key."],
     ["SMS one-time codes are the strongest form of MFA.","Hardware tokens and passkeys resist phishing and SIM-swap; SMS does not."],
     ["A 256-bit RSA key is as strong as 256-bit AES.","Asymmetric keys need to be far longer; RSA-256 would be broken instantly."]]},
 netattacks:{area:"sec",cat:"Network attacks",topic:"network attacks and defence in depth",
  T:[["ARP spoofing lets an attacker on the LAN become a man-in-the-middle by poisoning ARP caches.","Victims send traffic to the attacker's MAC."],
     ["DNS spoofing or cache poisoning sends users to an attacker's server by returning false records.","DNSSEC and validating resolvers mitigate it."],
     ["VLAN hopping via double tagging abuses the native VLAN to reach another VLAN.","Fix: use an unused native VLAN and tag it."],
     ["Phishing is social engineering that tricks users into giving credentials or running malware.","Spear phishing targets specific people."],
     ["Defence in depth layers controls so that one failure does not compromise everything.","Firewall + segmentation + EDR + MFA + backups."],
     ["IoT devices often ship with default credentials and rarely get patched, making them botnet targets.","Mirai scanned for default telnet logins."],
     ["A DDoS overwhelms a service with traffic from many sources.","Volumetric, protocol and application-layer variants."],
     ["Network segmentation limits how far an attacker can move laterally after a breach.","Put IoT and guests on separate VLANs."],
     ["SSL stripping downgrades HTTPS to HTTP so a MITM can read the traffic.","HSTS prevents it."],
     ["Pretexting is inventing a scenario to convince a target to share information.","'I'm from IT, I need your password to fix your account.'"],
     ["A rogue DHCP server can hand out a malicious default gateway or DNS server.","DHCP snooping on switches blocks it."],
     ["Least privilege means accounts and services get only the rights they need.","Limits blast radius when one is compromised."]],
  F:[["ARP spoofing works across the internet against any host.","ARP is a LAN protocol; the attacker must be on the local segment."],
     ["DNSSEC encrypts DNS queries so attackers cannot see them.","DNSSEC signs records for authenticity; it does not encrypt (DoH/DoT do)."],
     ["Double-tagging VLAN hopping works regardless of native VLAN configuration.","It depends on the attacker's access VLAN being the trunk's native VLAN."],
     ["Phishing is a technical exploit against a web server.","It is social engineering against people."],
     ["Defence in depth means relying on one very strong firewall.","It means multiple independent layers."],
     ["IoT devices are low-risk because they have little processing power.","They are prime botnet recruits due to default credentials and no patching."],
     ["A DDoS attack steals data from the target.","DDoS denies availability; it does not exfiltrate."],
     ["Network segmentation makes lateral movement easier for defenders to miss.","Segmentation restricts lateral movement and makes it more visible."],
     ["SSL stripping upgrades HTTP connections to HTTPS.","It downgrades HTTPS to HTTP."],
     ["Pretexting is a type of denial-of-service attack.","It is social engineering with an invented story."],
     ["A rogue DHCP server can only cause IP address conflicts.","It can set the gateway/DNS to attacker-controlled hosts for MITM."],
     ["Least privilege means giving every user administrator rights to avoid support tickets.","It is the opposite: minimum necessary rights."]]},
 procboot:{area:"os",cat:"Processes & boot",topic:"Windows processes and boot",
  T:[["smss.exe (Session Manager) starts csrss.exe and winlogon.exe during boot.","It is the first user-mode process."],
     ["lsass.exe handles authentication and holds credential material, which is why attackers dump it.","Credential Guard protects it."],
     ["services.exe is the Service Control Manager and is the parent of most service host processes.","svchost.exe instances hang off it."],
     ["Multiple svchost.exe processes are normal; each hosts a group of services.","Suspicious if the parent is not services.exe or the path is not System32."],
     ["explorer.exe is the desktop shell and is launched by userinit.exe after logon.","Winlogon → userinit → explorer."],
     ["The System process (PID 4) runs kernel threads.","It has no normal executable path."],
     ["Task Manager and tasklist show processes; tasklist /svc maps services to their svchost.","Useful for spotting rogue svchost instances."],
     ["A process's parent is a key forensic clue: a cmd.exe spawned by winword.exe is suspicious.","Macro-based attacks show exactly that tree."],
     ["Windows services can start automatically, manually, or be disabled, set via services.msc or sc.","sc query shows state; sc config changes start type."],
     ["Autoruns and the Run/RunOnce registry keys list programs started at logon.","Common persistence locations."],
     ["wininit.exe launches services.exe, lsass.exe and lsm during boot.","Session 0 initialisation."],
     ["The bootloader (bootmgr/winload.exe) loads the kernel (ntoskrnl.exe) and HAL into memory.","Then the kernel starts smss.exe."]],
  F:[["explorer.exe is the first process started after the kernel loads.","smss.exe is first; explorer.exe is the shell started after logon."],
     ["lsass.exe draws the Start menu and taskbar.","That is explorer.exe; lsass handles authentication."],
     ["Only one svchost.exe should ever be running; more than one indicates malware.","Many instances are normal; check parent and path instead."],
     ["The System process has PID 1.","System is PID 4; PID 1 is Linux init/systemd."],
     ["services.exe is launched by explorer.exe.","services.exe is launched by wininit.exe during boot."],
     ["A cmd.exe spawned by winword.exe is normal behaviour.","It is a classic sign of a malicious macro."],
     ["Windows services always start automatically and cannot be disabled.","Start type can be automatic, manual or disabled."],
     ["The Run registry key lists programs that run once at install time only.","Run executes at every logon; RunOnce runs once."],
     ["ntoskrnl.exe is the Windows bootloader.","ntoskrnl.exe is the kernel; bootmgr/winload are the bootloader."],
     ["tasklist /svc shows open network connections.","It maps services to processes; netstat shows connections."],
     ["csrss.exe is an optional process that can safely be killed.","Killing csrss.exe crashes the system."],
     ["userinit.exe runs the kernel's scheduler.","userinit runs logon scripts and starts the shell."]]},
 registry:{area:"os",cat:"Registry & persistence",topic:"the registry and persistence",
  T:[["HKLM\\...\\CurrentVersion\\Run starts programs for every user at logon; HKCU\\...\\Run is per user.","Both are top persistence locations."],
     ["The registry hives live on disk as files such as SYSTEM, SOFTWARE, SAM and NTUSER.DAT.","NTUSER.DAT is each user's HKCU."],
     ["Scheduled tasks are a common persistence method that survives reboots.","schtasks /query lists them; look for odd paths and triggers."],
     ["The hosts file (System32\\drivers\\etc\\hosts) overrides DNS and can redirect sites.","Malware edits it to block AV updates or redirect banking sites."],
     ["Group Policy can push registry settings and scripts to many machines at once.","GPO abuse is a domain-wide persistence vector."],
     ["Services with an unquoted path containing spaces can be hijacked by placing a binary earlier in the path.","C:\\Program Files\\App\\svc.exe → C:\\Program.exe."],
     ["Image File Execution Options (IFEO) Debugger keys can make Windows launch a different binary in place of a program.","Classic sticky-keys style backdoor."],
     ["reg query reads keys from the command line; reg add writes them.","Scriptable alternative to regedit."],
     ["WMI event subscriptions can run code when a trigger fires and persist with no file on disk.","Fileless persistence; list with Get-WMIObject in the root\\subscription namespace."],
     ["The Winlogon Userinit and Shell values can be altered to launch malware at logon.","They should point to userinit.exe and explorer.exe only."],
     ["Forensic timelines rely on registry key last-write timestamps.","They show when persistence was installed."],
     ["HKEY_CURRENT_USER is a view of the logged-on user's hive under HKEY_USERS.","HKU\\<SID> is the same data."]],
  F:[["HKCU\\...\\Run applies to every user on the machine.","HKCU is per user; HKLM\\...\\Run is machine-wide."],
     ["The registry exists only in memory and is rebuilt from scratch at each boot.","Hives are persisted as files on disk."],
     ["Scheduled tasks are cleared on every reboot so they cannot persist.","Tasks persist until deleted."],
     ["The hosts file is consulted only after DNS fails.","hosts is checked before DNS."],
     ["Unquoted service paths are harmless because Windows always finds the right executable.","Windows tries each space-split prefix, enabling hijacks."],
     ["IFEO keys are used to store printer settings.","IFEO can redirect program launches via the Debugger value."],
     ["WMI persistence always drops an executable in System32.","WMI event subscriptions can be entirely fileless."],
     ["The Winlogon Shell value should point to cmd.exe on a healthy system.","It should be explorer.exe."],
     ["reg add deletes a registry key.","reg add creates/sets; reg delete removes."],
     ["Group Policy can only change desktop wallpaper.","GPOs push security settings, scripts, registry values and software."],
     ["Registry keys have no timestamps.","Each key records a last-write time."],
     ["NTUSER.DAT holds the machine-wide SYSTEM hive.","NTUSER.DAT is the per-user HKCU hive."]]}
};
function gFactsFor(tbl){return function(r){
  const pick=(arr,n)=>shuffle(r,arr.slice()).slice(0,n);
  const trueQ=r()<0.6;
  let opts,ans,why,q;
  if(trueQ){const t=pick(tbl.T,1)[0],f=pick(tbl.F,3);opts=[t,...f];q=`Which statement about ${tbl.topic} is TRUE?`;ans=0;why=t[1]}
  else{const f=pick(tbl.F,1)[0],t=pick(tbl.T,3);opts=[f,...t];q=`Which statement about ${tbl.topic} is FALSE?`;ans=0;why="That one is false: "+f[1]}
  // shuffle options, track answer
  const idx=shuffle(r,[0,1,2,3]);const o=idx.map(i=>{const st=opts[i];const isTrue=tbl.T.includes(st);return{t:st[0],why:(trueQ?(isTrue?st[1]:"that statement is false — "+st[1]):(isTrue?"that statement is actually true — "+st[1]:st[1]))}});const a=idx.indexOf(ans);
  return{q,opts:o,a,cat:tbl.area,sub:tbl.cat,w:why,folder:"Concept check"};
}}

/* ---- no-repeat dealer: one per session. Deals statics from a shuffled deck (reshuffles only when exhausted); generated items are rejected if their stem was seen this session. ---- */
function makeDealer(r,statics,gens,opts){
  opts=opts||{};const seen=new Set();let deck=shuffle(r,statics.slice());const genShare=opts.genShare==null?(gens.length?0.5:0):opts.genShare;
  const nextStatic=()=>{if(!deck.length){if(!statics.length)return null;deck=shuffle(r,statics.slice());seen.clear()}const q=deck.pop();seen.add(stemKey({q:q.q,code:q.code,opts:q.o}));return shuffleItem(r,statItem(q))};
  const nextGen=()=>{for(let t=0;t<30;t++){const it=genFrom(r,gens);const k=stemKey(it);if(!seen.has(k)){seen.add(k);return shuffleItem(r,it)}}return null};
  let widened=false;return{next(){const exhausted=!deck.length;if(exhausted&&!gens.length&&opts.fallback){if(!widened){widened=true;if(this.onWiden)this.onWiden()}return opts.fallback.next()}const wantGen=gens.length&&(statics.length===0||exhausted||r()<genShare);let it=wantGen?nextGen():null;if(!it)it=nextStatic();if(!it)it=nextGen();return it},remaining(){return deck.length},seen,get widened(){return widened}};
}
function clusterStatics(areaKey,cluster){const tags=new Set(cluster.tags);return BANK.filter(q=>mapArea(q.a)===areaKey&&tags.has(q.s))}
function areaStatics(areaKey){return BANK.filter(q=>mapArea(q.a)===areaKey)}
function areaGens(areaKey){const a=AREAS.find(x=>x.k===areaKey);const out=[];for(const c of a.gen)out.push(...GENS[c]);return out}
/* drawArea now dealer-backed: the session owns the dealer so repeats can't happen within it */
function sessionDealer(areaKey,clusterName,r){
  if(clusterName){const c=CLUSTERS[areaKey].find(x=>x.n===clusterName);const st=clusterStatics(areaKey,c);const fb=c.gens.length?null:makeDealer(r,areaStatics(areaKey).filter(q=>!st.includes(q)),areaGens(areaKey),{genShare:0.5});return makeDealer(r,st,c.gens,{genShare:c.gens.length?(st.length<6?0.75:st.length<20?0.6:0.5):0,fallback:fb})}
  const st=areaStatics(areaKey),g=areaGens(areaKey);
  return makeDealer(r,st,g,{genShare:g.length?(st.length<20?0.8:st.length<40?0.6:0.5):0});
}

  const r=mulberry32((Date.now()^Math.floor(Math.random()*1e9))>>>0);

  while(items.length<cfg.n&&guard++<cfg.n*20){const it=cfg.kind==="gate"?genGateDrill(r):cfg.gen(r);const k=cfg.kind==="gate"?it.cells.map(c=>c.key).join():it.grid.flat().map(c=>c.key).join();if(seen.has(k))continue;seen.add(k);items.push(it)}
  MX=Object.assign({items,ans:[],times:[],idx:0,start:Date.now(),qStart:Date.now(),hint:{},used:{},gone:{},aided:{}},cfg);
  if(MTIMER)clearInterval(MTIMER);
  MTIMER=setInterval(tickMatrix,250);
  renderMatrixQ();window.scrollTo(0,0);
}
function tickMatrix(){
  if(!MX){clearInterval(MTIMER);return}
  if(PAUSE)return;
  const now=Date.now();
  if(MX.total){const left=MX.total-Math.floor((now-MX.start)/1000);const t=document.getElementById("mclock");if(t){t.textContent=fmtClock(Math.max(0,left));t.classList.toggle("warn",left<=60)}if(left<=0){finishMatrix(true);return}}
  if(MX.per){const el=document.getElementById("ring");const used=(now-MX.qStart)/1000;const left=Math.max(0,MX.per-used);
    if(el){const C=2*Math.PI*26;el.querySelector("circle.p").style.strokeDashoffset=C*(1-left/MX.per);el.querySelector("text").textContent=Math.ceil(left);el.classList.toggle("warn",left<=10);el.classList.toggle("mid",left<=MX.per*0.5&&left>10)}
    if(left<=0&&MX.ans[MX.idx]===undefined){MX.times[MX.idx]=MX.per;MX.ans[MX.idx]=-1;advanceMatrix()}
  }
}
function advanceMatrix(){if(MX.idx<MX.items.length-1){MX.idx++;MX.qStart=Date.now();renderMatrixQ();window.scrollTo(0,0)}else finishMatrix(false)}
function ringSVG(per){const C=2*Math.PI*26;return `<svg id="ring" class="ring" viewBox="0 0 60 60" aria-label="seconds left"><circle cx="30" cy="30" r="26" class="bg"/><circle cx="30" cy="30" r="26" class="p" style="stroke-dasharray:${C};stroke-dashoffset:0"/><text x="30" y="35" text-anchor="middle">${per}</text></svg>`}
function renderMatrixQ(){
  const el=document.getElementById("view-matrix");const it=MX.items[MX.idx],n=MX.items.length,sel=MX.ans[MX.idx];
  const instant=MX.fb==="instant",answered=sel!==undefined,reveal=instant&&answered;
  const done=MX.ans.filter(a=>a!==undefined).length;
  const isGate=MX.kind==="gate";
  const correct=isGate?it.a:it.answer;
  const head=`<div class="qhead"><span>${isGate?"Gate":"Matrix"} ${MX.idx+1} of ${n}${MX.step?" · "+esc(MX.step.name.split("·")[0].trim()):""}</span><span>${MX.total?`<span id="mclock" class="clock">${fmtClock(Math.max(0,MX.total-Math.floor((Date.now()-MX.start)/1000)))}</span> · `:""}${done}/${n}</span></div>
  <div class="bar"><i style="width:${(MX.idx+1)/n*100}%"></i></div>`;
  const hinted=MX.hint[MX.idx];
  let body;
  if(isGate){
    body=`<div class="gaterow legend"><span class="small muted">Full piece set:</span><div class="gcell sm">${it.gi.render(it.gi.FULL)}</div></div>
    <div class="gaterow">${it.cells.map((c,k)=>`<div class="gcell">${svgOf(c.items)}</div>${k<2?`<div class="gop">${k===0?"?":"="}</div>`:""}`).join("")}</div>
    <p class="muted small" style="text-align:center">Which gate turns the first two cells into the third? (NAND and NOR are measured against the full set.)</p>
    ${hinted&&!reveal?`<div class="callout small"><b>Reveal:</b> look for a piece that is in neither input — if there is one it's NAND or NOR; otherwise compare the result's size with the inputs.</div>`:""}
    <div class="choices" id="ch">${it.opts.map((o,k)=>{let c="choice";const gone=(MX.gone[MX.idx]||[]).includes(k)&&!reveal;if(reveal){if(k===correct)c+=" correct";else if(k===sel)c+=" wrong"}if(gone)c+=" gone";return `<button class="${c}" data-k="${k}" ${reveal||gone?"disabled":""} aria-pressed="${sel===k}"><span class="b">${L8[k]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
    ${reveal?`<div class="fb ${sel===correct?"correct":"wrong"}"><span class="mk">${sel===correct?"Correct.":sel===-1?"Time ran out.":"Not quite."}</span> ${esc(it.why)}${gateTableHTML(it.gi,it.ma,it.mb,it.gate,sel>=0&&sel!==correct?gateFromText(it.opts[sel].t):null)}</div>`:""}`;
  }else{
    body=`${matrixHTML(it.grid,reveal?"reveal":"missing")}
    ${hinted?`<div class="callout small"><b>Hint:</b> ${esc(it.why.split(/(?<=\\.)\\s/)[0])}</div>`:""}
    <div class="opts">${it.opts.map((o,k)=>{let extra="";const gone=(MX.gone[MX.idx]||[]).includes(k)&&!reveal;if(reveal){if(k===correct)extra='style="border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)"';else if(k===sel)extra='style="border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)"'}return `<button class="opt ${gone?"gone":""}" data-k="${k}" aria-pressed="${sel===k}" ${reveal||gone?"disabled":""} ${extra} aria-label="Option ${L8[k]}">${svgOf(o.items)}<span class="l">${L8[k]}</span></button>`}).join("")}</div>
    ${reveal?`<div class="fb ${sel===correct?"correct":"wrong"}"><span class="mk">${sel===correct?"Correct.":sel===-1?"Time ran out.":"Not quite."}</span> ${esc(it.why)}${it.gi?gateTableHTML(it.gi,it.gi.masks[2][0],it.gi.masks[2][1],it.gate,sel>=0&&sel!==correct?gateOfOption(it,sel):null):""}</div>`:""}`;
  }
  const used=MX.used[MX.idx]||(MX.used[MX.idx]={});
  const aids=MX.aids&&!reveal?aidsBarHTML(isGate?["reveal"].concat(MX.per?["time"]:[]):["elim","reveal"].concat(MX.per?["time"]:[]),used):"";
  el.innerHTML=`${head}<div class="qtop">${MX.per?ringSVG(MX.per):""}<div class="qtopt">${MX.per?`<b>${MX.per}s</b> per item — auto-advances.`:"No per-item limit."}${MX.step&&MX.step.kind==="gate"?" Name it, don't solve it.":""}</div></div>
  ${body}
  <div class="qnav">${instant?(answered?`<button class="btn" id="next">${MX.idx<n-1?"Next":"Finish"}</button>`:`<span class="note">Pick an answer</span>`):`<button class="btn ghost" id="prev" ${MX.idx===0?"disabled":""}>Back</button>${MX.idx<n-1?`<button class="btn" id="next">Next</button>`:`<button class="btn" id="finish">Finish</button>`}`}</div>
  ${aids}
  <p class="note">${done} of ${n} answered. <button class="link" id="finishNow">Finish &amp; score</button> · <button class="link" id="quit">quit</button></p><div id="mbox"></div>`;
  tickMatrix();if(!answered&&MX.aids)armShimmer();else disarmShimmer();
  el.querySelectorAll("[data-aid]").forEach(b=>b.onclick=()=>{const k=b.dataset.aid;if(!useAid(k))return;used[k]=true;MX.aided[MX.idx]=true;
    if(k==="time"){MX.qStart+=30000;MX.per&&(MX.perBonus=(MX.perBonus||0));}
    else if(k==="reveal"){MX.hint[MX.idx]=true}
    else if(k==="elim"){const wrong=shuffle(mulberry32(Date.now()>>>0),it.opts.map((o,i)=>i).filter(i=>i!==correct)).slice(0,isGate?1:2);MX.gone[MX.idx]=wrong}
    renderMatrixQ()});
  el.querySelectorAll("[data-goview]").forEach(b=>b.onclick=()=>show(b.dataset.goview));
  const choose=k=>{if(MX.ans[MX.idx]!==undefined&&instant)return;MX.ans[MX.idx]=k;MX.times[MX.idx]=Math.round((Date.now()-MX.qStart)/1000);
    disarmShimmer();
    if(instant){const ok=k===correct;sfx(ok?"ok":"bad");buddyReact(ok?"ok":"bad");recordMatrixStat(isGate?"gate":it.cat,isGate?it.gate:it.gate,ok,MX.times[MX.idx]);if(ok){const fast=MX.per&&MX.times[MX.idx]<=MX.per*0.6;awardXP((isGate?8:15)+(fast?5:0)+(MX.aided[MX.idx]?-5:0),fast?"fast":"");awardGold(isGate?1:3)}}
    const y=window.scrollY;renderMatrixQ();window.scrollTo(0,y)};
  el.querySelectorAll("[data-k]").forEach(b=>{if(!reveal)b.onclick=()=>choose(+b.dataset.k)});
  const nx=el.querySelector("#next");if(nx)nx.onclick=()=>{if(instant)advanceMatrix();else{MX.idx=Math.min(n-1,MX.idx+1);MX.qStart=Date.now();renderMatrixQ();window.scrollTo(0,0)}};
  const p=el.querySelector("#prev");if(p)p.onclick=()=>{MX.idx=Math.max(0,MX.idx-1);MX.qStart=Date.now();renderMatrixQ();window.scrollTo(0,0)};
  const box=el.querySelector("#mbox");
  const fin=()=>{const left=n-done;if(!left){finishMatrix(false);return}askInline(box,`${left} unanswered will be marked wrong. Finish and score anyway?`,"Finish & score",()=>finishMatrix(false))};
  const f=el.querySelector("#finish");if(f)f.onclick=fin;el.querySelector("#finishNow").onclick=fin;
  el.querySelector("#quit").onclick=()=>askInline(box,`Quit now? The ${done} you answered will be recorded; the rest won't count.`,"Quit",()=>{abandonSessions();renderMatrix();window.scrollTo(0,0)});
}
function finishMatrix(timeout){
  if(!MX)return;clearInterval(MTIMER);MTIMER=null;disarmShimmer();
  const isGate=MX.kind==="gate";
  const ok=MX.items.filter((it,k)=>MX.ans[k]===(isGate?it.a:it.answer)).length;
  const secs=Math.floor((Date.now()-MX.start)/1000);
  if(MX.fb!=="instant"){MX.items.forEach((it,k)=>{const good=MX.ans[k]===(isGate?it.a:it.answer);recordMatrixStat(isGate?"gate":it.cat,it.gate,good,MX.times[k]||Math.round(secs/MX.items.length))});awardXP(ok*(isGate?8:15),MX.step?MX.step.name.split("·")[0].trim():"matrix run");awardGold(ok*(isGate?1:3))}
  let passed=false;
  if(MX.step){const X=xpLoad();const st=X.steps[MX.step.id]||(X.steps[MX.step.id]={best:0,passes:0});const acc=ok/MX.items.length;st.best=Math.max(st.best,acc);if(acc>=MX.step.pass){st.passes++;passed=true}xpSave(X);if(passed){awardXP(50,"step passed");awardGold(15,"step passed")}}
  window.__M={items:MX.items,ans:MX.ans.slice(),times:MX.times.slice(),ok,total:MX.items.length,secs,timeout:!!timeout,kind:MX.kind,step:MX.step,passed};
  logAttempt({mode:isGate?"Gate drill":"Matrix test",scope:MX.step?MX.step.name:"Matrix",ok,total:MX.items.length,secs,area:null});
  MX=null;window.__mfilter="all";renderMatrixResults();
}
function renderMatrixResults(){
  const el=document.getElementById("view-matrix");const R=window.__M;const pct=Math.round(R.ok/R.total*100);const isGate=R.kind==="gate";
  const rows=R.items.map((it,k)=>({it,k,mine:R.ans[k],ok:R.ans[k]===(isGate?it.a:it.answer),t:R.times[k]})).filter(x=>window.__mfilter==="all"||!x.ok);
  const fams={};R.items.forEach((it,k)=>{const key=isGate?"gate:"+it.gate:((it.gate&&it.cat!=="hell")?"gate:"+it.gate:it.cat);const f=fams[key]||(fams[key]={ok:0,t:0});f.t++;if(R.ans[k]===(isGate?it.a:it.answer))f.ok++});
  const famRows=Object.entries(fams).sort((a,b)=>a[1].ok/a[1].t-b[1].ok/b[1].t);
  const avg=Math.round(R.secs/R.total);
  el.innerHTML=`<h1>${isGate?"Gate drill":"Matrix"} results</h1>
  <div class="sheet ${R.step?(R.passed?"passed":"failed"):""}"><div class="score">${R.ok} / ${R.total}</div><p style="margin:0">${pct}% in ${fmtClock(R.secs)} (${avg}s per item${R.timeout?" — <b>time ran out</b>":""})</p>
  ${R.step?`<p style="margin:8px 0 0"><b>${R.passed?"Step passed — next step unlocked.":"Not yet — pass mark is "+Math.round(R.step.pass*100)+"%. Run it again; the items will be different."}</b></p>`:""}
  ${!isGate&&avg>60?`<p class="small" style="margin:6px 0 0">Over 60s average. On the real test that pace leaves items blank — practice committing at 45 seconds.`:""}</div>
  <h2>By family</h2><div class="cats">${famRows.map(([k,v])=>{const p=v.ok/v.t;return `<div class="cat"><div class="top"><span>${esc(famName(k))}</span><span><b>${v.ok}/${v.t}</b></span></div><div class="track"><i style="width:${Math.max(p*100,2)}%;background:${p>=.8?"var(--ok)":p>=.6?"var(--accent)":"var(--bad)"}"></i></div></div>`}).join("")}</div>
  <h2>Review</h2><div class="seg" role="group"><button data-f="all" aria-pressed="${window.__mfilter==="all"}">All</button><button data-f="wrong" aria-pressed="${window.__mfilter==="wrong"}">Wrong only</button></div>
  <div class="stack" style="margin-top:14px">${rows.length?rows.map(({it,k,mine,ok,t})=>isGate?`<article class="rev ${ok?"ok":"bad"}"><div class="row" style="justify-content:space-between"><span class="verdict">${k+1}. ${ok?"Correct":mine===-1?"Timed out":mine===undefined?"Not answered":"Wrong"}</span><span class="tag">${t!==undefined?t+"s":""}</span></div><div class="gaterow">${it.cells.map((c,j)=>`<div class="gcell">${svgOf(c.items)}</div>${j<2?`<div class="gop">${j===0?"?":"="}</div>`:""}`).join("")}</div><p class="small"><b>${esc(GATEN[it.gate])}.</b> ${esc(it.why)}</p>${gateTableHTML(it.gi,it.ma,it.mb,it.gate,mine>=0&&mine!==it.a?gateFromText(it.opts[mine].t):null)}</article>`:
  `<article class="rev ${ok?"ok":"bad"}"><div class="row" style="justify-content:space-between"><span class="verdict">${k+1}. ${ok?"Correct":mine===-1?"Timed out":mine===undefined?"Not answered":"Wrong"}</span><span class="tag">${esc(famName(it.gate?"gate:"+it.gate:it.cat))}${t!==undefined?" · "+t+"s":""}</span></div>
    ${matrixHTML(it.grid,"reveal")}
    <div class="pair" style="justify-content:center">${mine>=0&&mine!==it.answer?`<figure><div class="mini">${svgOf(it.opts[mine].items)}</div>Your pick (${L8[mine]})</figure>`:""}<figure><div class="mini">${svgOf(it.opts[it.answer].items)}</div>Correct (${L8[it.answer]})</figure></div>
    <p class="small" style="margin:6px 0 0">${esc(it.why)}</p>${it.gi&&it.cat!=="hell"?gateTableHTML(it.gi,it.gi.masks[2][0],it.gi.masks[2][1],it.gate,mine>=0&&mine!==it.answer?gateOfOption(it,mine):null):""}</article>`).join(""):`<p>Nothing wrong — clean sweep.</p>`}</div>
  <div class="row" style="margin-top:22px"><button class="btn" id="again">Back to Matrix</button><button class="btn ghost" data-goview="progress">See progress</button></div>`;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{window.__mfilter=b.dataset.f;renderMatrixResults()});
  el.querySelectorAll("[data-goview]").forEach(b=>b.onclick=()=>show(b.dataset.goview));
  el.querySelector("#again").onclick=()=>{window.__M=null;renderMatrix()};
}

/* ================= keyboard shortcuts ================= */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(PAUSE)resumeNow();else if(pauseAvailable())pauseNow();e.preventDefault();return}
  if(PAUSE)return;
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const key=e.key.toLowerCase();
  // matrix selection A-H / 1-8 (checked first — 8 options)
  const m8="abcdefgh".indexOf(key), n8="12345678".indexOf(key);
  const mi=m8>=0?m8:n8;
  if(MX&&mi>=0&&MX.ans[MX.idx]===undefined){const b=document.querySelector(`#view-matrix [data-k="${mi}"]`);if(b&&!b.disabled){b.click();e.preventDefault();return}}
  // answer selection A-D / 1-4 (CNT questions)
  const map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(key in map){
    const i=map[key];
    if(S&&S.cur&&S.mode==="practice"&&S.picked===null){pickSession(i);e.preventDefault();return}
    if(T){const btn=document.querySelector(`#view-test #ch [data-k="${i}"]`);if(btn){btn.click();e.preventDefault();return}}
  }
  if(e.key==="Enter"||e.key===" "){
    if(e.key===" "&&e.target&&(e.target.id==="next"||e.target.id==="finish"))return; // that button handles its own space
    const n=document.querySelector("#next")||document.querySelector("#finish");
    if(n){n.click();e.preventDefault()}
    else if(S&&S.mode==="flash"){const rv=document.querySelector("#reveal");if(rv){rv.click();e.preventDefault()}}
  }
});
