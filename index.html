/* ============ Windows internals, logs, event IDs, SIDs, ACLs, ADS, firewall rules ============ */
const BANK2=[
/* --- the eleven on the whiteboard --- */
{a:"os",f:"Windows",s:"UNC paths",d:1,q:"Which is a correctly formed UNC path to a shared folder?",o:["\\\\fileserver01\\Finance\\Q3","//fileserver01/Finance/Q3","C:\\fileserver01\\Finance","smb:fileserver01:Finance"],c:0,w:"UNC (Universal Naming Convention) is \\\\server\\share\\path — two leading backslashes, then the host, then the share name. Forward slashes are URL/Unix style, and C:\\ is a local drive path. The 'net use' command maps a drive letter to a UNC path."},
{a:"os",f:"Windows",s:"UNC paths",d:2,q:"An admin connects to \\\\WS07\\C$ . What is C$?",o:["A hidden administrative share of the whole C: drive","A user's home folder shared with the Domain Users group","A printer share published to Active Directory","A share that is only reachable over FTP, not SMB"],c:0,w:"Windows creates hidden admin shares automatically: C$ (each drive), ADMIN$ (the Windows folder) and IPC$ (inter-process/named pipes). The trailing $ hides the share from browse lists; members of Administrators can still reach it. Attackers use C$/ADMIN$ with stolen admin credentials for lateral movement (PsExec style)."},
{a:"svc",f:"Windows",s:"Ports",d:1,q:"TCP port 389 is used by which service?",o:["LDAP","Kerberos","SMB","RDP"],c:0,w:"LDAP (directory lookups against Active Directory) uses 389; LDAPS (LDAP over TLS) uses 636, and the AD Global Catalog uses 3268/3269. Kerberos is 88, SMB 445, RDP 3389."},
{a:"os",f:"Windows",s:"SIDs",d:2,q:"Which relative identifier (RID) always belongs to the built-in local Administrator account?",o:["500","501","512","1000"],c:0,w:"The built-in Administrator is S-1-5-21-<domain or machine>-500. Guest is RID 501, krbtgt is 502, Domain Admins group is 512, Domain Users 513, and ordinary new accounts start at 1000. Because renaming the account does not change the SID, analysts look for RID 500 to find the real Administrator."},
{a:"os",f:"Windows",s:"SIDs",d:3,q:"Which SID identifies the Local System (SYSTEM) account?",o:["S-1-5-18","S-1-5-32-544","S-1-1-0","S-1-5-21-…-500"],c:0,w:"Well-known SIDs: S-1-5-18 Local System, S-1-5-19 Local Service, S-1-5-20 Network Service, S-1-5-32-544 the Administrators group, S-1-5-32-545 Users, S-1-1-0 Everyone. S-1-5-21-…-500 is the built-in Administrator user."},
{a:"os",f:"Windows",s:"Event logs",d:3,q:"A user logged on over Remote Desktop. In which Windows log, and with what event, is that recorded?",o:["Security log, Event ID 4624 with Logon Type 10 (RemoteInteractive)","System log, Event ID 7045 with Logon Type 3 (Network)","Application log, Event ID 1000 with Logon Type 2 (Interactive)","Security log, Event ID 4688 with Logon Type 5 (Service)"],c:0,w:"Successful logons are Security Event ID 4624; the Logon Type field says how: 10 = RemoteInteractive (RDP), 2 = local interactive, 3 = network (SMB share, etc.), 5 = service, 7 = unlock, 11 = cached. The TerminalServices-LocalSessionManager/Operational log also records RDP sessions (Event 21). 7045 is a new service installed; 4688 is process creation."},
{a:"os",f:"Windows",s:"Event logs",d:2,q:"Security Event ID 4625 means:",o:["A logon attempt failed","A user account was created","The audit log was cleared","A service was installed"],c:0,w:"4625 = failed logon (4624 = success). 4720 = account created, 1102 = audit log cleared, 7045 (System log) = new service installed. A burst of 4625s from one source IP is the classic signature of a brute-force attempt."},
{a:"os",f:"Windows",s:"Event logs",d:3,q:"Which event ID records that a new process was started (with its command line, if auditing is enabled)?",o:["4688","4624","4672","4740"],c:0,w:"4688 is Process Creation and is the Windows equivalent of watching execve on Linux; with command-line auditing enabled it shows the full command. 4624 is logon, 4672 is special privileges assigned (admin logon), 4740 is account lockout."},
{a:"svc",f:"Network Fundamentals",s:"FTP",d:2,q:"A user connects to an FTP server on port 21, logs in successfully, but every directory listing or download hangs. The most likely cause is:",o:["The data channel (TCP 20 in active mode, or the passive-mode port) is being blocked","The FTP server is not running, so only the firewall is answering on port 21","Port 21 is reserved for SFTP, so FTP control traffic is being rejected","DNS is misconfigured, so the server cannot resolve the client's name"],c:0,w:"FTP uses two connections: port 21 for commands and a separate data channel for listings/transfers. In active mode the server opens TCP 20 back toward the client, which client-side firewalls/NAT often block; in passive mode the server opens a high port the client must reach. Login works because that only uses 21 — transfers fail because the data channel never opens."},
{a:"os",f:"Windows",s:"Processes",d:2,q:"Which process provides the Windows graphical shell — the desktop, taskbar and Start menu?",o:["explorer.exe","winlogon.exe","csrss.exe","services.exe"],c:0,w:"explorer.exe is the shell: desktop, taskbar, Start menu and File Explorer windows. winlogon.exe handles logon/logoff and the Ctrl+Alt+Del secure attention sequence, csrss.exe is the Win32 subsystem process, and services.exe is the Service Control Manager. The shell is set by the registry value Winlogon\\Shell, which malware sometimes hijacks."},
{a:"fund",f:"Windows",s:"Boot process",d:2,q:"During boot, what is the firmware layer that sits between the hardware and the operating system loader?",o:["UEFI (or legacy BIOS)","The HAL","The Windows kernel (ntoskrnl.exe)","The registry"],c:0,w:"The system firmware — UEFI on modern machines, BIOS on older ones — initializes hardware, runs POST and hands off to the boot loader. The HAL (hardware abstraction layer) is a different bridge: it lets the already-running kernel talk to hardware uniformly at run time. Windows boot order: UEFI → bootmgfw.efi → winload.efi → ntoskrnl.exe/hal.dll → smss → csrss/wininit → services/lsass → winlogon → explorer."},
{a:"fund",f:"Windows",s:"Boot process",d:3,q:"What is the role of the HAL (hal.dll) in Windows?",o:["It abstracts hardware differences so the kernel and drivers can run on different platforms","It is the firmware that runs POST and hands control to the bootloader at startup","It stores user profiles and registry hives so they survive a hardware change","It manages the GUI and translates window messages into hardware interrupts"],c:0,w:"The Hardware Abstraction Layer is loaded with the kernel and hides chipset/platform differences (interrupt controllers, timers, bus access) behind one interface. Firmware (UEFI/BIOS) runs before the OS; profiles live in the registry/NTUSER.DAT; the GUI shell is explorer.exe."},
{a:"net",f:"Network Fundamentals",s:"TCP handshake",d:2,q:"What does the SYN flag in the first segment of a TCP handshake actually do?",o:["Requests a connection and tells the peer the sender's initial sequence number to synchronize on","Synchronizes the two hosts' clocks so that retransmission timers agree on both sides","Acknowledges data received so far and asks the peer to synchronize its window size","Signals the sender has finished sending and asks the peer to synchronize before closing"],c:0,w:"SYN = synchronize sequence numbers: it opens a connection and carries the sender's Initial Sequence Number (ISN) so both sides can track bytes. The reply SYN-ACK does the same in the other direction plus acknowledges the first ISN. It has nothing to do with clocks; ACK acknowledges data and FIN ends a session."},
{a:"net",f:"Network Fundamentals",s:"OSI model",d:3,q:"Within OSI layers 1–4, which layer establishes, maintains and tears down end-to-end connections between two hosts (as TCP does)?",o:["Layer 4 — Transport","Layer 3 — Network","Layer 2 — Data link","Layer 1 — Physical"],c:0,w:"Connection-oriented end-to-end delivery (handshake, sequencing, reliability, ports) is Transport, Layer 4. Session (Layer 5) manages dialogs between applications — but if the choices are only Layers 1–4, Transport is the answer. Network routes packets, Data link frames on one link, Physical moves bits (and defines duplex mode)."},
{a:"net",f:"Network Fundamentals",s:"OSI model",d:3,q:"Which OSI layer is responsible for dialog control between applications — opening, synchronizing (checkpoints) and closing a conversation?",o:["Layer 5 — Session","Layer 4 — Transport","Layer 6 — Presentation","Layer 7 — Application"],c:0,w:"The Session layer controls the dialog: who talks when (simplex/half/full-duplex at the dialog level), checkpoints and recovery, and session teardown (e.g., NetBIOS sessions, RPC). Transport gives end-to-end connections and reliability; Presentation handles encoding/encryption/compression; Application is the user-facing protocol (HTTP, FTP)."},
{a:"sec",f:"Security",s:"VLAN attacks",d:3,q:"An attacker sends a frame carrying two 802.1Q tags so that the first switch strips the outer tag and the next switch forwards it onto a VLAN the attacker is not a member of. This is:",o:["VLAN hopping by double tagging","ARP poisoning of the gateway","MAC flooding of the CAM table","DHCP starvation of the pool"],c:0,w:"Double tagging is one of the two VLAN-hopping techniques (the other is switch spoofing, negotiating a trunk via DTP). It works one way only and requires the attacker to sit on the native VLAN of the trunk. Mitigations: set an unused native VLAN, disable DTP, and never put users on the native VLAN."},
{a:"sec",f:"Security",s:"Rootkits",d:3,q:"Which class of malware hides itself by hooking system calls — for example by patching the kernel's system service table so that queries for its files and processes return filtered results?",o:["Rootkit","Bootkit","Worm","Trojan"],c:0,w:"Hooking system calls/APIs to lie to the OS and to security tools is the defining rootkit behavior (kernel-mode rootkits patch the SSDT or use inline hooks; user-mode ones hook DLL imports). A bootkit is a rootkit that infects the MBR/VBR/boot loader to load before the OS — it's about *where it starts*, not the hooking itself. Worms spread; trojans deceive."},
{a:"sec",f:"Security",s:"IDS vs IPS",d:3,q:"What is the guaranteed advantage of deploying a detection sensor out-of-band (on a SPAN/mirror port or tap) rather than inline?",o:["It cannot add latency or drop legitimate traffic — if the sensor fails or is overloaded, traffic still flows","It can block attacks in real time because it sees every packet before the destination host does","It sees encrypted payloads because the SPAN port hands it the session keys along with the frames","It needs no signature updates because it learns normal traffic from the mirrored stream on its own"],c:0,w:"Out-of-band = passive copy of traffic: zero impact on the production path, fails safe, no added latency. The trade-off is it can only alert (IDS behaviour), not block. Inline (IPS) can drop malicious packets but becomes a point of failure and adds latency; it is usually built to 'fail open'. Neither sees inside TLS without decryption."},
{a:"sec",f:"Security",s:"Firewalls",d:3,code:"# Default policies\niptables -P INPUT DROP\niptables -P OUTPUT DROP\n# Rule 1\niptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT",q:"A host has the firewall above. Bobby runs: ssh admin@192.168.12.11 . Which single rule must be added for the session to work?",o:["iptables -A OUTPUT -p tcp --dport 22 -m state --state NEW,ESTABLISHED -j ACCEPT","iptables -A INPUT -p tcp --dport 22 -j ACCEPT","iptables -A INPUT -p tcp --sport 22 -j ACCEPT","iptables -A OUTPUT -p tcp --sport 22 -j ACCEPT"],c:0,w:"The outgoing SYN to the server's port 22 is blocked by OUTPUT DROP, so an OUTPUT rule for destination port 22 is needed. The replies come back on INPUT, but Rule 1 already accepts ESTABLISHED,RELATED packets, so no extra INPUT rule is required. Option B would allow *inbound* SSH to this host (a server rule), not an outbound client connection."},
{a:"sec",f:"Security",s:"Firewalls",d:3,q:"Why is a rule like  -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT  placed first in a stateful firewall?",o:["It lets replies to connections the host itself started come back without a separate rule for every service","It opens every port to the internet so that any inbound connection is accepted without further checks","It blocks all new connections, inbound and outbound, until the administrator adds a rule for each service","It only applies to UDP, since TCP connections are already tracked by the kernel's socket table"],c:0,w:"Stateful inspection tracks connections. Once the host sends a SYN out, return packets are ESTABLISHED and RELATED covers helper connections (like FTP data). Placing that rule first means you only have to write explicit rules for NEW connections you want to allow, in whichever direction."},
/* --- Windows depth: processes, auth, registry, ACLs, ADS, tools --- */
{a:"os",f:"Windows",s:"Processes",d:3,q:"Which Windows process authenticates users and enforces the local security policy — and is the prime target for credential-dumping tools like Mimikatz?",o:["lsass.exe","svchost.exe","csrss.exe","smss.exe"],c:0,w:"lsass.exe (Local Security Authority Subsystem) handles logons, password changes and holds credential material in memory, which is why dumping its memory yields NTLM hashes and Kerberos tickets. svchost hosts service DLLs, csrss is the Win32 subsystem, smss is the Session Manager (first user-mode process)."},
{a:"os",f:"Windows",s:"Processes",d:3,q:"On a healthy Windows system, every svchost.exe instance should be a child of which process?",o:["services.exe","explorer.exe","winlogon.exe","lsass.exe"],c:0,w:"services.exe (the Service Control Manager) launches svchost.exe to host service DLLs. An svchost.exe spawned by explorer.exe, cmd.exe or a user process, running from a path other than C:\\Windows\\System32, or with a misspelled name (scvhost, svch0st) is a classic malware tell."},
{a:"os",f:"Windows",s:"Processes",d:2,q:"Which Windows process has PID 4?",o:["System (the kernel and kernel-mode threads)","smss.exe (the Session Manager)","wininit.exe (Windows Start-Up)","explorer.exe (the Windows shell)"],c:0,w:"PID 4 is the 'System' process, which represents the kernel (ntoskrnl.exe) and its worker threads. PID 0 is System Idle. smss.exe is the first user-mode process it starts; everything else descends from there."},
{a:"os",f:"Windows",s:"Boot process",d:3,q:"Put the Windows startup chain in order after the kernel loads.",o:["smss.exe → csrss.exe / wininit.exe → services.exe & lsass.exe → winlogon.exe → explorer.exe","explorer.exe → winlogon.exe → smss.exe / csrss.exe → services.exe & lsass.exe → wininit.exe","services.exe → smss.exe / csrss.exe → explorer.exe & lsass.exe → wininit.exe → winlogon.exe","winlogon.exe → smss.exe / csrss.exe → services.exe & lsass.exe → wininit.exe → explorer.exe"],c:0,w:"Session Manager (smss) starts first in user mode, creates csrss and wininit (session 0) and winlogon (session 1). wininit starts services.exe and lsass.exe. winlogon shows the logon screen and, after authentication, launches userinit.exe which starts the shell, explorer.exe. Knowing this tree is how you spot a process running where it shouldn't."},
{a:"os",f:"Windows",s:"Authentication",d:2,q:"Which authentication protocol does Windows use by default between domain members and domain controllers?",o:["Kerberos","NTLM","LM","Basic over HTTP"],c:0,w:"Kerberos (TCP/UDP 88) has been the default domain authentication since Windows 2000. NTLM is the fallback (workgroups, IP-address connections, legacy); LM is obsolete and trivially cracked. Kerberos is ticket based (TGT from the KDC, then service tickets), which avoids sending password hashes over the network."},
{a:"os",f:"Windows",s:"Authentication",d:3,q:"Where are local account password hashes stored on a Windows machine, and where are domain account hashes stored?",o:["Local: the SAM hive; Domain: NTDS.dit on the domain controller","Local: NTDS.dit; Domain: the SAM hive on the domain controller","Both in C:\\Windows\\System32\\config\\passwords.txt on every host","Both in HKEY_CURRENT_USER under the user's SID on every host"],c:0,w:"Local accounts live in the SAM registry hive (C:\\Windows\\System32\\config\\SAM, locked while Windows runs). Domain accounts live in the Active Directory database NTDS.dit on each DC. Both store NT hashes, which is why attackers dump SAM/NTDS or lsass memory for pass-the-hash."},
{a:"sec",f:"Windows",s:"Authentication",d:3,q:"What is a pass-the-hash attack?",o:["Authenticating to a Windows service using a stolen NTLM hash directly, without knowing the plaintext password","Cracking a stolen NTLM hash with a rainbow table to recover the plaintext password before logging on","Replaying a captured Kerberos ticket to a service before it expires, without knowing the user's password","Brute-forcing a web login by submitting every hash from a stolen SAM file until one is accepted"],c:0,w:"NTLM authentication proves possession of the hash, not the password, so a stolen hash can be used as-is to authenticate (SMB, WMI, PsExec). Mitigations: Kerberos-only, Credential Guard, LAPS, restricting local admin reuse. Replaying a stolen Kerberos ticket is the related 'pass-the-ticket' attack."},
{a:"os",f:"Windows",s:"Registry",d:3,q:"Where on disk are the HKLM registry hives (SAM, SECURITY, SOFTWARE, SYSTEM) stored?",o:["C:\\Windows\\System32\\config\\","C:\\Windows\\Registry\\","C:\\Users\\Default\\","C:\\Program Files\\Common Files\\"],c:0,w:"The machine hives are files in %SystemRoot%\\System32\\config. Each user's HKCU hive is NTUSER.DAT in their profile folder (C:\\Users\\<name>). Forensic tools parse these files offline when the system isn't running."},
{a:"os",f:"Windows",s:"Registry",d:3,q:"Besides the Run/RunOnce keys, which registry location lets malware start automatically by replacing the program that launches the shell at logon?",o:["HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon (Shell / Userinit values)","HKCU\\Control Panel\\Desktop (Wallpaper / ScreenSaveActive / ScreenSaveTimeOut values)","HKLM\\HARDWARE\\DESCRIPTION\\System\\CentralProcessor\\0 (ProcessorNameString / Identifier values)","HKCR\\.txt (Content Type / PerceivedType / OpenWithProgids values)"],c:0,w:"The Winlogon key's Shell value should be explorer.exe and Userinit should be userinit.exe; appending another executable makes it launch at every logon. Other persistence spots: HKLM\\SYSTEM\\CurrentControlSet\\Services, scheduled tasks, the Startup folder, and WMI event subscriptions."},
{a:"os",f:"Windows",s:"Registry",d:2,q:"Which command-line tool queries or edits the registry without opening regedit?",o:["reg (e.g., reg query HKLM\\...\\Run)","regsvr32 (e.g., regsvr32 /s file.dll)","gpupdate (e.g., gpupdate /force)","sc (e.g., sc query type= service)"],c:0,w:"reg.exe supports query, add, delete, export and import from cmd. PowerShell uses Get-ItemProperty on the HKLM:/HKCU: drives. regsvr32 registers DLLs/COM objects, gpupdate refreshes Group Policy, sc manages services."},
{a:"os",f:"Windows",s:"ACLs",d:3,q:"A user is in a group that is Allowed Modify on a folder and in another group that is explicitly Denied Write on the same folder. What can the user do?",o:["Read but not write — an explicit Deny overrides Allow","Write — Modify includes Write, and Allow overrides Deny","Nothing — any conflict removes all access to the object","Full control — group permissions are cumulative"],c:0,w:"NTFS DACL evaluation: permissions from all groups are cumulative, but an explicit Deny always wins over an Allow at the same level. So Modify's Read & Execute still applies, while Write is denied. Order of precedence: explicit Deny > explicit Allow > inherited Deny > inherited Allow."},
{a:"os",f:"Windows",s:"ACLs",d:3,q:"A folder is shared with Share permission 'Everyone: Read' and NTFS permission 'Users: Full Control'. A user accesses it over the network. Effective access is:",o:["Read — the more restrictive of share and NTFS permissions applies over the network","Full Control — NTFS wins because it is evaluated last, after the share permission","Full Control — share permissions are ignored once the user is authenticated to the domain","No access — conflicting share and NTFS permissions cancel each other out entirely"],c:0,w:"Over the network both filters apply and the most restrictive result wins, so Read. Locally (console logon) only NTFS applies, so the same user at the keyboard would have Full Control. Best practice: set share to Full Control for the right group and do real control with NTFS."},
{a:"os",f:"Windows",s:"ACLs",d:2,q:"Which Windows tool displays or modifies NTFS permissions from the command line?",o:["icacls","chmod","attrib","cipher"],c:0,w:"icacls (and the older cacls) shows and sets DACLs: icacls C:\\data /grant Users:(R). chmod is Unix, attrib sets file attributes (hidden, read-only), cipher manages EFS encryption."},
{a:"os",f:"Windows",s:"ACLs",d:3,q:"In Windows, what is the SACL of an object used for?",o:["Auditing — it specifies which access attempts generate Security log events","Granting or denying access — it is evaluated before the DACL on every request","Storing the file's hash so that tampering can be detected by the system","Encrypting the file so only the listed principals can decrypt and read it"],c:0,w:"An NTFS security descriptor has a DACL (who may do what) and a SACL (what gets audited). SACL entries produce Security log events (4663 object access) when auditing is enabled. Encryption is EFS/BitLocker, separate from ACLs."},
{a:"os",f:"Windows",s:"Alternate data streams",d:3,q:"On NTFS, malware stores a payload as  report.docx:evil.exe . What is this and how do you list it?",o:["An Alternate Data Stream (ADS); dir /r shows streams","A symbolic link; use mklink /d to display its target","A compressed file; use compact /u to expand it","A junction point; use fsutil reparsepoint query"],c:0,w:"NTFS files can carry extra named streams invisible to normal dir, Explorer and file size. 'dir /r' or Sysinternals 'streams' lists them, and 'more < file:stream' reads one. Windows itself uses the Zone.Identifier stream (mark-of-the-web) on downloaded files; attackers use ADS to hide tools."},
{a:"os",f:"Windows",s:"Alternate data streams",d:2,q:"What does the Zone.Identifier alternate data stream on a downloaded file do?",o:["Marks the file as from the Internet so Windows warns (SmartScreen / Protected View) before running it","Stores the file's SHA-256 checksum so Windows can verify it has not been altered since download","Records the file's original owner and download URL so Windows can audit who introduced it","Compresses the file transparently so Windows can store downloads using less disk space"],c:0,w:"The 'mark-of-the-web' ADS carries ZoneId=3 for Internet downloads; Office opens such files in Protected View and SmartScreen prompts on executables. Removing it ('unblock') is why attackers deliver payloads inside containers like ISO/ZIP that historically didn't propagate the mark."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"Which command lists the members of the local Administrators group?",o:["net localgroup administrators","net user administrator /domain","whoami /groups /fo list","tasklist /svc /v"],c:0,w:"net localgroup <group> lists group members; net user <name> shows one account's details; whoami /groups shows the *current* user's groups and whoami /priv its privileges; tasklist /svc maps processes to the services they host."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"Which command maps drive letter X: to a network share?",o:["net use X: \\\\server\\share","net share X: \\\\server\\share","mount \\\\server\\share X:","subst X: \\\\server\\share"],c:0,w:"net use maps or lists network connections (net use alone lists them, net use X: /delete removes one). net share creates/lists shares *on this machine*; mount is Unix; subst maps a local path to a drive letter."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"Which command shows every TCP/UDP listener and connection with the owning process ID on Windows?",o:["netstat -ano","netstat -r","ipconfig /all","tasklist /m"],c:0,w:"-a all sockets, -n numeric, -o owning PID (add -b to show the executable). Map the PID with tasklist /fi \"PID eq 1234\" or Get-Process -Id. netstat -r prints the routing table (same as route print)."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"Which command lists services and their state from the Windows command line?",o:["sc query","net start /all","services.exe","schtasks /query"],c:0,w:"sc query lists services (sc qc <name> shows config, sc create installs one). net start without arguments lists only *running* services. services.exe is the SCM process, not a tool; schtasks manages scheduled tasks, another persistence spot."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"Which command shows the Windows DNS resolver cache?",o:["ipconfig /displaydns","nslookup -type=cache .","arp -a -v","netsh dns show cache"],c:0,w:"ipconfig /displaydns prints cached name→IP records (ipconfig /flushdns clears them) — useful for seeing what hosts a machine recently resolved. arp -a shows the IP→MAC cache; nslookup queries a server, it doesn't show the cache."},
{a:"os",f:"Windows",s:"Event logs",d:2,q:"Where are Windows event log files stored on disk?",o:["%SystemRoot%\\System32\\winevt\\Logs\\*.evtx","%SystemRoot%\\System32\\LogFiles\\*.log","%SystemRoot%\\System32\\config\\Events\\*.evt","C:\\ProgramData\\Microsoft\\Events\\*.log"],c:0,w:"Each log (Security.evtx, System.evtx, Application.evtx, plus Applications and Services logs) is an .evtx file in System32\\winevt\\Logs. View them with Event Viewer (eventvwr.msc), wevtutil, or PowerShell Get-WinEvent. /var/log is Linux."},
{a:"os",f:"Windows",s:"Event logs",d:2,q:"Which PowerShell cmdlet retrieves entries from the Security log (e.g., all events with ID 4624)?",o:["Get-WinEvent -FilterHashtable @{LogName='Security';Id=4624}","Get-Content C:\\Windows\\System32\\winevt\\Logs\\Security.evtx | Select-String 4624","Read-EventLog -LogName Security -EventId 4624","Show-Log -Security -Id 4624 -Newest 100"],c:0,w:"Get-WinEvent (and the older Get-EventLog) read event logs; the FilterHashtable form is fast and precise. Event logs are binary .evtx, so Get-Content would not parse them."},
{a:"os",f:"Windows",s:"Event logs",d:3,q:"Security Event ID 1102 appears in the log. What happened?",o:["Someone cleared the Security audit log","A user was added to a privileged group","A scheduled task was created or changed","A logon failed because of a bad password"],c:0,w:"1102 'The audit log was cleared' records who cleared it — one of the most important single events for an investigator, since attackers clear logs to cover tracks. 4728/4732 are group membership changes, 4698 task created, 4625 failed logon."},
{a:"os",f:"Windows",s:"Event logs",d:3,q:"System Event ID 7045 shows a new service installed with an ImagePath pointing to C:\\Users\\Public\\svc.exe. Why is this suspicious?",o:["Legitimate services almost never run from user-writable folders; attackers install services for persistence and SYSTEM privileges","7045 only appears on domain controllers, so seeing it on a workstation means the host has been promoted or impersonated","Services cannot be installed remotely, so a 7045 event proves that someone was physically at the console at the time","Services always run as the logged-in user, so a service in a Temp folder means that user's account has been compromised"],c:0,w:"Service installation (7045) is how tools like PsExec and many malware families gain persistence and run as SYSTEM. A binary in C:\\Users\\Public, Temp or AppData is a red flag. Correlate with 4697 (Security) and the account that installed it."},
{a:"os",f:"Windows",s:"Logon types",d:3,q:"A 4624 event shows Logon Type 3 from Source Network Address 10.0.0.9. What does Logon Type 3 mean?",o:["Network logon — the account accessed this machine's resources over the network (SMB share, WMI, etc.) without an interactive session","Interactive logon at the console — the user typed credentials at the physical keyboard of this machine and got a desktop","Remote Desktop session — the user connected over RDP (TCP 3389) and received a full interactive desktop on this machine","Service account start — the Service Control Manager started a service on this machine using stored account credentials"],c:0,w:"Logon types: 2 interactive (keyboard), 3 network (share/WMI/RPC), 4 batch (scheduled task), 5 service, 7 unlock, 8 network cleartext (basic auth), 9 new credentials (runas /netonly), 10 RemoteInteractive (RDP), 11 cached interactive (laptop off the domain). Lateral movement with PsExec/WMI shows as type 3."},
{a:"sec",f:"Windows",s:"Defenses",d:2,q:"What does User Account Control (UAC) do?",o:["Runs admins with a standard-user token and prompts before granting elevated (admin) rights","Encrypts user folders with a per-user key so that other administrators cannot read them","Blocks all downloads from the Internet zone unless an administrator approves each one","Replaces passwords with PINs and biometric unlock so that credentials are never typed"],c:0,w:"UAC gives administrators a split token; processes start with the filtered standard token and must be elevated (the consent prompt) to use the admin token. It limits the damage of malware running as a logged-in admin. BitLocker/EFS encrypt; SmartScreen screens downloads."},
{a:"sec",f:"Windows",s:"Defenses",d:3,q:"Which Windows feature lets an administrator whitelist which executables and scripts may run, by path, publisher or hash?",o:["AppLocker (or WDAC)","BitLocker (or EFS)","Windows Firewall","Credential Guard (or LSA protection)"],c:0,w:"AppLocker / Windows Defender Application Control enforce application allow-lists. BitLocker is full-disk encryption, Windows Firewall filters network traffic, Credential Guard isolates LSA secrets with virtualization to defeat credential dumping."},
{a:"sec",f:"Windows",s:"Defenses",d:2,q:"Windows Defender Firewall applies different rule sets depending on which network profile is active. The profiles are:",o:["Domain, Private, Public","Trusted, Untrusted, DMZ","Home, Work, Internet","LAN, WAN, VPN"],c:0,w:"Domain (joined and can reach a DC), Private (home/work network you marked trusted), Public (default, most restrictive). Rules can be scoped per profile; netsh advfirewall or Get-NetFirewallRule manages them."},
{a:"os",f:"Windows",s:"Group Policy",d:3,q:"In what order are Group Policy Objects applied, so that later ones override earlier ones?",o:["Local → Site → Domain → OU (LSDOU)","OU → Domain → Site → Local (ODSL)","Domain → Local → OU → Site (DLOS)","Site → Local → Domain → OU (SLDO)"],c:0,w:"LSDOU: local policy first, then site, domain, and each OU down the tree; the closest (OU) wins on conflict unless a higher GPO is set Enforced. Clients refresh every 90 minutes ± 30 (gpupdate forces it); gpresult /r shows what applied."},
{a:"os",f:"Windows",s:"Forensics",d:3,q:"Which Windows artifact records that an executable was run, including run count and last run time, even if the file has since been deleted?",o:["Prefetch files (C:\\Windows\\Prefetch\\*.pf)","The hosts file (C:\\Windows\\System32\\drivers\\etc\\hosts)","The page file (C:\\pagefile.sys)","The Recycle Bin (C:\\$Recycle.Bin)"],c:0,w:"Prefetch (and also Amcache, ShimCache/AppCompatCache, UserAssist) are 'evidence of execution' artifacts. Prefetch files are named PROGRAM.EXE-<hash>.pf and store last run times and files touched at launch."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"What does  whoami /priv  show?",o:["The privileges held by the current user's token (e.g., SeDebugPrivilege) and whether each is enabled","The current user's NTLM password hash and whether it has been cached for pass-the-hash reuse","All users on the machine, their group memberships and whether each account is enabled or locked","The machine's SID, its domain membership and whether the computer account password is current"],c:0,w:"whoami /priv lists token privileges; SeDebugPrivilege, SeImpersonatePrivilege and SeBackupPrivilege are the ones attackers look for during privilege escalation. whoami /groups shows group SIDs, whoami /all shows everything."},
{a:"os",f:"Windows",s:"Commands",d:3,q:"An analyst runs  tasklist /svc . What does the /svc switch add?",o:["The services hosted inside each process — essential for telling svchost.exe instances apart","The parent PID of each process — essential for rebuilding the process tree after the fact","The full command line of each process — essential for spotting encoded PowerShell payloads","The user account that started each process — essential for spotting services running as SYSTEM"],c:0,w:"/svc maps each process (notably each svchost.exe) to the service names it hosts. For parent PID or command line use wmic process get name,processid,parentprocessid,commandline or PowerShell Get-CimInstance Win32_Process. /v adds the user name."},
{a:"os",f:"Windows",s:"PowerShell",d:2,q:"Which PowerShell cmdlet shows active TCP connections with owning process, similar to netstat -ano?",o:["Get-NetTCPConnection","Get-Service -Status Running","Get-NetAdapter -Physical","Test-NetConnection -Port"],c:0,w:"Get-NetTCPConnection returns local/remote address, state and OwningProcess. Get-NetAdapter lists interfaces, Test-NetConnection is a ping/port-test tool, Get-Service lists services."},
{a:"sec",f:"Windows",s:"Attacks",d:3,q:"A PowerShell command line contains  -NoProfile -WindowStyle Hidden -EncodedCommand JAB...  . Why is this a red flag?",o:["Base64-encoded, hidden-window PowerShell is the standard way malware downloads and runs payloads while evading casual inspection","Encoded commands cannot run on Windows unless the execution policy has been set to Unrestricted, so someone has already weakened the host","PowerShell cannot access the network on its own, so an encoded command must be a wrapper around a separate downloader binary","It means the user is an administrator, because only elevated sessions are allowed to run encoded commands with a hidden window"],c:0,w:"-EncodedCommand accepts a Base64 UTF-16 script; combined with hidden window and bypassed execution policy it is a hallmark of droppers. Decode it ([Text.Encoding]::Unicode.GetString([Convert]::FromBase64String(...))) and check Event 4104 (Script Block Logging)."},
{a:"os",f:"Windows",s:"Services",d:2,q:"What is the Windows equivalent of a Unix daemon, and which tool manages them?",o:["A service, managed by the Service Control Manager (services.msc / sc / Get-Service)","A scheduled task, managed by the Task Scheduler (taskschd.msc / schtasks / Get-ScheduledTask)","A DLL, managed by the registration server (regsvr32 / rundll32 / Register-Dll)","A process, managed by the Windows shell (explorer.exe / tasklist / Get-Process)"],c:0,w:"Services run in the background without a logged-in user, often as SYSTEM, Local Service or Network Service. The SCM (services.exe) starts them; config lives under HKLM\\SYSTEM\\CurrentControlSet\\Services."},
{a:"os",f:"Windows",s:"File system",d:2,q:"Which file system provides Windows ACLs, encryption, compression, journaling and alternate data streams?",o:["NTFS","FAT32","exFAT","ext4"],c:0,w:"NTFS supports security descriptors, EFS, compression, the $LogFile journal, hard links, and ADS. FAT32/exFAT have none of these (hence a USB stick formatted FAT loses permissions); ext4 is Linux."},
{a:"os",f:"UNIX",s:"Commands",d:2,q:"Which Linux command identifies what kind of data a file contains by examining its header (magic bytes) rather than its name?",o:["file","head","stat","ls -l"],c:0,w:"file reads the first bytes and compares them with its magic database ('ELF 64-bit', 'PE32 executable', 'PNG image'). head prints the first lines, stat shows metadata (size, inode, times), ls -l shows permissions and size. Attackers rename binaries to .txt; file isn't fooled."},
{a:"os",f:"UNIX",s:"Commands",d:1,q:"Which command prints the first 10 lines of a file by default?",o:["head","tail","cat","less"],c:0,w:"head shows the beginning (head -n 20 for 20 lines); tail the end (tail -f follows a growing log); cat dumps everything; less pages interactively. For a hex view of a file header use xxd or hexdump -C."},
{a:"os",f:"UNIX",s:"Commands",d:2,q:"Which command extracts printable text from a binary file — useful for spotting URLs or IP addresses embedded in malware?",o:["strings","grep -b","cat -v","od"],c:0,w:"strings prints sequences of printable characters (default 4+). od and xxd dump raw bytes; cat -v shows non-printing characters but is not a search tool."},
{a:"os",f:"UNIX",s:"Logs",d:2,q:"On Linux, where would you look for SSH login successes and failures?",o:["/var/log/auth.log (Debian/Ubuntu) or /var/log/secure (RHEL/CentOS)","/etc/ssh/sshd_config (Debian/Ubuntu) or /etc/ssh/ssh_config (RHEL/CentOS)","/var/log/dmesg (Debian/Ubuntu) or /var/log/messages (RHEL/CentOS)","~/.ssh/known_hosts (Debian/Ubuntu) or ~/.ssh/authorized_keys (RHEL/CentOS)"],c:0,w:"sshd logs through syslog to auth.log or secure: 'Accepted password for', 'Failed password for', 'Invalid user'. sshd_config is configuration, dmesg is kernel messages, known_hosts stores server fingerprints. journalctl -u ssh works on systemd hosts."},
{a:"sec",f:"Security",s:"Packet capture",d:2,q:"Which tcpdump command captures only SSH traffic involving host 192.168.12.11 on eth0, without resolving names?",o:["tcpdump -n -i eth0 host 192.168.12.11 and port 22","tcpdump -i eth0 ssh 192.168.12.11 port 22 -q","tcpdump -n -i eth0 192.168.12.11:22 -proto tcp","tcpdump -n -i eth0 -h 192.168.12.11 -p 22 -proto tcp"],c:0,w:"BPF filter syntax: host, net, port, src/dst, and/or/not. -n skips DNS/port-name lookups, -i picks the interface, -w file.pcap saves a capture, -r reads one, -c N stops after N packets, -X shows hex and ASCII."},
{a:"sec",f:"Security",s:"Packet capture",d:3,q:"What does  tcpdump 'tcp[tcpflags] & (tcp-syn) != 0 and tcp[tcpflags] & (tcp-ack) == 0'  show?",o:["Only initial SYN packets — new connection attempts (useful for spotting scans)","Only completed handshakes — established sessions (useful for spotting data transfers)","All UDP traffic — connectionless datagrams (useful for spotting DNS tunneling)","Only RST packets — aborted connections (useful for spotting closed ports)"],c:0,w:"SYN set and ACK clear is the first packet of a handshake. A flood of them to many ports from one source is a port scan; to one port from many sources is a SYN flood. SYN-ACKs would have both bits set."},
{a:"sec",f:"Security",s:"Packet filtering",d:3,q:"An extended ACL must allow users on 10.1.0.0/16 to reach a web server at 192.168.5.10 on HTTPS only. Which rule is correct?",o:["permit tcp 10.1.0.0 0.0.255.255 host 192.168.5.10 eq 443","permit ip any any eq 443","permit tcp host 192.168.5.10 10.1.0.0 0.0.255.255 eq 443","permit udp 10.1.0.0 0.0.255.255 any eq 443"],c:0,w:"Cisco extended ACL order: protocol, source + wildcard, destination + wildcard, port. 0.0.255.255 is the wildcard for /16. HTTPS is TCP 443. Option C reverses source and destination; B is far too broad; D is the wrong protocol."},
{a:"sec",f:"Security",s:"Log analysis",d:3,code:"Dec 11 02:14:07 srv sshd[8812]: Failed password for root from 203.0.113.9 port 50112 ssh2\nDec 11 02:14:09 srv sshd[8812]: Failed password for root from 203.0.113.9 port 50112 ssh2\nDec 11 02:14:12 srv sshd[8812]: Failed password for root from 203.0.113.9 port 50112 ssh2\nDec 11 02:14:30 srv sshd[8814]: Accepted password for root from 203.0.113.9 port 50140 ssh2",q:"What do these log lines most likely show?",q2:"",o:["A password-guessing attack against root from 203.0.113.9 that eventually succeeded","A normal administrator logon from 203.0.113.9 after a few mistyped passwords","A port scan from 203.0.113.9 that probed SSH along with several other services","A failed SSH key exchange from 203.0.113.9 caused by a mismatched host key"],c:0,w:"Repeated 'Failed password' lines from one source seconds apart followed by 'Accepted password' is a successful brute-force. Immediate actions: check what that session did (last, auth.log, bash history), block the IP, disable root password login (PermitRootLogin no), require keys."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"Which command displays the full TCP/IP configuration, including MAC address, DHCP server and DNS servers, on Windows?",o:["ipconfig /all","ifconfig -a -v","netstat -i -n","route print -4"],c:0,w:"ipconfig alone shows IP, mask and gateway; /all adds MAC, DHCP lease, DNS and WINS servers. ifconfig is Unix (now ip addr), netstat -i is interface statistics, route print the routing table."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"What does the Windows command  net user hacker P@ss1 /add  do, and why would a defender care?",o:["Creates a new local account named 'hacker' — a classic persistence step that generates Security Event 4720","Changes the current user's password to 'hacker' — a classic lockout step that generates Security Event 4724","Lists every local account whose name contains 'hacker' — a reconnaissance step that generates no event","Deletes the local account named 'hacker' — a classic anti-forensics step that generates Security Event 4726"],c:0,w:"net user <name> <password> /add creates a local user; attackers then add it to Administrators with net localgroup administrators hacker /add (Event 4732). Audit 4720/4732 and unexpected new accounts."},
{a:"os",f:"Windows",s:"Processes",d:3,q:"Task Manager shows a process named lsass.exe running from C:\\Users\\bob\\AppData\\Local\\Temp. Why is that a problem?",o:["Real lsass.exe runs once from C:\\Windows\\System32 as SYSTEM; a copy elsewhere is malware masquerading as a system process","lsass.exe should run from C:\\Program Files as the logged-in user; a copy under System32 is malware hiding among system files","Temp folders cannot contain executables, so a process that claims to run from one has corrupted the process list","There should be several lsass.exe instances, one per logged-on user; a single instance means the others were killed"],c:0,w:"Core system processes have fixed paths, parents, users and counts: one lsass.exe, one services.exe, from System32, started by wininit.exe, running as SYSTEM. Any deviation — wrong path, wrong parent, user context, extra copies — is a strong malware indicator."},
{a:"os",f:"Windows",s:"Commands",d:2,q:"Which Windows command-line tool queries WMI — for example  wmic process get name,executablepath  ?",o:["wmic","wevtutil","msinfo32","dism"],c:0,w:"wmic (Windows Management Instrumentation Command-line) queries system classes; attackers also abuse it (wmic process call create). PowerShell's Get-CimInstance is its successor. wevtutil manages event logs, msinfo32 shows system info, dism services images."}
];

/* ============ LOG / OUTPUT INTERPRETATION GENERATORS (fresh values each time) ============ */
function rIP(r){return pick(r,["10","172.16","192.168","203.0.113","198.51.100"])+"."+(ri(r,1,254))+"."+ri(r,1,254)}
function rUser(r){return pick(r,["admin","bob","jsmith","svc_backup","root","alice","deploy"])}
function gWinLogon(r){
  const types=[[2,"Interactive — logged on at the local console/keyboard"],[3,"Network — accessed a resource over the network (share, WMI, PsExec) with no interactive session"],[10,"RemoteInteractive — connected over Remote Desktop (RDP)"],[5,"Service — a service was started with the account's credentials"],[4,"Batch — a scheduled task ran under the account"],[7,"Unlock — the workstation was unlocked"],[11,"CachedInteractive — logged on with cached domain credentials (no DC reachable)"]];
  const [t,desc]=pick(r,types);const u=rUser(r),ip=rIP(r),host=pick(r,["WS"+ri(r,10,99),"FS01","DC02","LAPTOP-"+ri(r,100,999)]);
  const code=`Log Name:      Security\nEvent ID:      4624\nTask Category: Logon\nAccount Name:  ${u}\nLogon Type:    ${t}\nSource Network Address: ${t===2||t===7?"127.0.0.1":ip}\nWorkstation Name: ${host}`;
  const q={t:desc,why:`Correct. 4624 is a successful logon and Logon Type ${t} means: ${desc}.`};
  const ds=types.filter(x=>x[0]!==t).map(x=>({t:x[1],why:`That is Logon Type ${x[0]}, not ${t}.`}));
  const {opts,a}=mk(r,q,shuffle(r,ds));
  return{cat:"os",q:`How did account ${u} log on, according to this Windows Security event?`,code,opts,a};
}
function gEventID(r){
  const ids=[[4624,"Successful logon"],[4625,"Failed logon"],[4634,"Logoff"],[4672,"Special privileges assigned to new logon (admin-level logon)"],[4688,"New process created"],[4697,"Service installed (Security log)"],[4698,"Scheduled task created"],[4720,"User account created"],[4726,"User account deleted"],[4732,"Member added to a security-enabled local group (e.g., Administrators)"],[4740,"Account locked out"],[4768,"Kerberos TGT requested"],[4776,"NTLM credential validation"],[1102,"Audit log cleared"],[7045,"New service installed (System log)"],[4104,"PowerShell script block logged"]];
  const [id,desc]=pick(r,ids);
  const q={t:desc,why:`Correct. Event ID ${id} = ${desc}.`};
  const ds=shuffle(r,ids.filter(x=>x[0]!==id)).slice(0,3).map(x=>({t:x[1],why:`That is Event ID ${x[0]}.`}));
  const {opts,a}=mk(r,q,ds);
  return{cat:"os",q:`Windows Event ID ${id} records which of the following?`,opts,a};
}
function gSSHLog(r){
  const u=rUser(r),ip=rIP(r),p=ri(r,40000,60000);
  const kind=pick(r,["brute","key","invalid","ok"]);
  let code,q,ds;
  if(kind==="brute"){const n=ri(r,3,6);code=Array.from({length:n},(_,k)=>`sshd[${900+k}]: Failed password for ${u} from ${ip} port ${p+k} ssh2`).join("\n")+`\nsshd[${900+n}]: Accepted password for ${u} from ${ip} port ${p+n} ssh2`;
    q={t:`${ip} guessed ${u}'s password after ${n} failures and now has a shell`,why:`Correct. Repeated failures from one source followed by an Accepted line is a successful brute-force; treat ${u}'s session from ${ip} as hostile.`};
    ds=[{t:`${u} mistyped the password and then logged in normally`,why:`Possible for one or two failures — but ${n} rapid failures from a public/remote address followed by success fits an attack far better.`},{t:`${ip} ran a port scan against port 22`,why:`A scan would not produce password attempts; these lines are authentication events.`},{t:`The SSH service crashed and restarted`,why:`Nothing here indicates a crash; the PIDs are per-connection.`}];}
  else if(kind==="key"){code=`sshd[1142]: Accepted publickey for ${u} from ${ip} port ${p} ssh2: RSA SHA256:k9f...\nsshd[1142]: pam_unix(sshd:session): session opened for user ${u}`;
    q={t:`${u} authenticated from ${ip} with an SSH key, not a password`,why:`Correct. 'Accepted publickey' means key-based auth succeeded; a password logon would read 'Accepted password'.`};
    ds=[{t:`${u} logged in with a password`,why:`That would say 'Accepted password'.`},{t:`The login failed`,why:`'Accepted' and 'session opened' mean success.`},{t:`${ip} is the SSH server`,why:`'from ${ip}' is the client's address; the server is the host writing the log.`}];}
  else if(kind==="invalid"){code=`sshd[1201]: Invalid user ${pick(r,["oracle","test","pi","ubuntu","git"])} from ${ip} port ${p}\nsshd[1201]: Failed password for invalid user from ${ip} port ${p} ssh2`;
    q={t:`${ip} tried an account that does not exist on this host — typical automated scanning`,why:`Correct. 'Invalid user' means the username itself is unknown; attackers spray common default names across the internet.`};
    ds=[{t:`A local user forgot their password`,why:`The account doesn't exist, so this isn't a real user.`},{t:`The connection succeeded`,why:`It failed ('Failed password').`},{t:`The SSH key was rejected`,why:`This was a password attempt against a nonexistent account.`}];}
  else {code=`sshd[1330]: Accepted password for ${u} from ${ip} port ${p} ssh2\nsshd[1330]: pam_unix(sshd:session): session opened for user ${u}\nsshd[1330]: Received disconnect from ${ip}: 11: disconnected by user\nsshd[1330]: pam_unix(sshd:session): session closed for user ${u}`;
    q={t:`${u} logged in from ${ip} over SSH, worked, and logged out normally`,why:`Correct. Accepted → session opened → disconnect by user → session closed is a complete normal session.`};
    ds=[{t:`The server rejected ${u}`,why:`'Accepted' means authentication succeeded.`},{t:`${ip} is being brute-forced`,why:`There is exactly one, successful attempt.`},{t:`${u} connected over Telnet`,why:`These are sshd entries — SSH.`}];}
  const {opts,a}=mk(r,q,ds);
  return{cat:"sec",q:"Which statement is true about this auth log excerpt?",code,opts,a};
}
function gNetstatPid(r){
  const procs=shuffle(r,[["sshd",22],["httpd",80],["mysqld",3306],["smbd",445],["svchost.exe",135],["RDP (svchost/TermService)",3389],["dns (named)",53]]).slice(0,3);
  const pids=shuffle(r,[ri(r,400,900),ri(r,1000,1900),ri(r,2000,4900)]);
  const rip=rIP(r),lip="10.0.0."+ri(r,2,254);
  const k=ri(r,0,2);
  const rows=procs.map((p,i)=>`tcp    0    0 ${i===k?lip:"0.0.0.0"}:${p[1]}    ${i===k?rip+":"+ri(r,40000,60000)+"    ESTABLISHED":"0.0.0.0:*    LISTEN"}    ${pids[i]}`);
  const code=`Proto Recv-Q Send-Q Local Address      Foreign Address      State        PID\n`+rows.join("\n");
  const q={t:`PID ${pids[k]} has an active session with ${rip} on port ${procs[k][1]} (${procs[k][0]})`,why:`Correct. The ESTABLISHED row shows a live connection on local port ${procs[k][1]} owned by PID ${pids[k]}; the foreign address ${rip} is the peer.`};
  const ds=[{t:`PID ${pids[(k+1)%3]} is connected to ${rip}`,why:`PID ${pids[(k+1)%3]} is only LISTENING (foreign 0.0.0.0:*), it has no peer.`},{t:`${rip} is listening on port ${procs[k][1]}`,why:`${rip} is the *remote* side; the local host owns the socket.`},{t:`Port ${procs[(k+2)%3][1]} is closed`,why:`LISTEN means the port is open and waiting for connections.`}];
  const {opts,a}=mk(r,q,ds);
  return{cat:"os",q:"Based on this netstat -ano style output, which statement is true?",code,opts,a};
}
function gIptables(r){
  const port=pick(r,[[22,"SSH"],[80,"HTTP"],[443,"HTTPS"],[3389,"RDP"],[445,"SMB"]]);
  const srv=rIP(r),cli=rIP(r);
  const scenario=pick(r,["client","server"]);
  if(scenario==="client"){
    const hasEst=r()<0.5;
    const code=`iptables -P INPUT DROP\niptables -P OUTPUT DROP\n${hasEst?"iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT\n":""}iptables -A OUTPUT -p tcp --dport ${port[0]} -j ACCEPT`;
    const q=hasEst?{t:`Yes — the outbound SYN is allowed and replies match ESTABLISHED on INPUT`,why:`Correct. OUTPUT allows new connections to port ${port[0]}, and the stateful INPUT rule accepts the return packets.`}:{t:`No — the outbound packets leave, but the server's replies are dropped by INPUT DROP`,why:`Correct. There is no INPUT rule for ESTABLISHED/RELATED (or for --sport ${port[0]}), so the SYN-ACK never gets in and the handshake fails.`};
    const ds=hasEst?[{t:`No — an INPUT rule for --dport ${port[0]} is also required`,why:`That would allow *inbound* ${port[1]} to this host; replies to our own connection are covered by ESTABLISHED.`},{t:`No — OUTPUT must use --sport ${port[0]}`,why:`The client's source port is ephemeral; the *destination* port is ${port[0]}.`},{t:`Yes, but only for UDP`,why:`${port[1]} is TCP; the rule says -p tcp.`}]:[{t:`Yes — the OUTPUT rule is enough`,why:`Traffic is two-way; with INPUT policy DROP and no stateful rule, the replies die.`},{t:`Yes — DROP policies only apply to UDP`,why:`Policies apply to every packet not matched by a rule, any protocol.`},{t:`No — because port ${port[0]} is privileged`,why:`Privileged ports concern *binding*, not connecting out.`}];
    const {opts,a}=mk(r,q,ds);
    return{cat:"sec",q:`This host (${cli}) has the rules below. Can a user on it successfully open a ${port[1]} session to ${srv}:${port[0]}?`,code,opts,a};
  }
  const net=pick(r,["10.1.0.0/16","192.168.50.0/24","172.16.8.0/22"]);
  const inside=net.startsWith("10.1")?"10.1."+ri(r,0,255)+"."+ri(r,1,254):net.startsWith("192")?"192.168.50."+ri(r,1,254):"172.16."+ri(r,8,11)+"."+ri(r,1,254);
  const outside=rIP(r);
  const code=`iptables -P INPUT DROP\niptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT\niptables -A INPUT -p tcp -s ${net} --dport ${port[0]} -j ACCEPT\niptables -A INPUT -p tcp --dport ${port[0]} -j DROP`;
  const q={t:`${inside} can connect; ${outside} is silently dropped`,why:`Correct. Rules are evaluated top down: ${inside} matches the -s ${net} ACCEPT; ${outside} doesn't, falls to the explicit DROP (and the DROP policy).`};
  const ds=[{t:`Both can connect`,why:`${outside} is outside ${net} and hits the DROP rule.`},{t:`Neither can connect`,why:`${inside} is inside ${net} and matches the ACCEPT before the DROP.`},{t:`${outside} connects but ${inside} is dropped`,why:`Reversed — the ACCEPT is for the ${net} source.`}];
  const {opts,a}=mk(r,q,ds);
  return{cat:"sec",q:`A ${port[1]} server runs these rules. Host ${inside} and host ${outside} both try to connect to port ${port[0]}. What happens?`,code,opts,a};
}
function gTcpdump(r){
  const ip=rIP(r),port=pick(r,[22,53,80,443,3389,445]),iface=pick(r,["eth0","ens33","en0"]);
  const forms=[
    [`tcpdump -n -i ${iface} host ${ip}`,`All packets to or from ${ip} on ${iface}, with numeric addresses`,[`Only packets sent by ${ip}`,`Only packets to port ${port}`,`Only DNS traffic`]],
    [`tcpdump -n -i ${iface} src host ${ip} and dst port ${port}`,`Packets from ${ip} going to port ${port}`,[`Packets from port ${port} to ${ip}`,`All packets involving ${ip}`,`Packets to ${ip} on any port`]],
    [`tcpdump -i ${iface} -w capture.pcap port ${port}`,`Save all port-${port} packets to a file for later analysis (e.g., in Wireshark)`,[`Print port-${port} packets as text and exit`,`Read a saved capture file`,`Write the routing table to a file`]],
    [`tcpdump -n -i ${iface} not port 22 and not port 53`,`Everything except SSH and DNS traffic`,[`Only SSH and DNS traffic`,`Nothing — 'not' is invalid`,`Only ICMP`]],
    [`tcpdump -r capture.pcap -n 'tcp port ${port}'`,`Read a saved capture and show only TCP port ${port} packets`,[`Capture live port-${port} traffic`,`Delete the capture file`,`Show only UDP port ${port}`]],
    [`tcpdump -n -i ${iface} -c 20 icmp`,`Capture 20 ICMP (ping-type) packets then stop`,[`Capture for 20 seconds`,`Capture 20 TCP packets`,`Ping ${ip} 20 times`]]
  ];
  const [cmd,ans,wrong]=pick(r,forms);
  const q={t:ans,why:`Correct. ${ans}. Key switches: -i interface, -n no name resolution, -w write pcap, -r read pcap, -c count; filters use host/port/src/dst/and/or/not.`};
  const {opts,a}=mk(r,q,wrong.map(t=>({t,why:"Re-read the filter expression and switches: -w writes, -r reads, src/dst restrict direction, 'not' excludes."})));
  return{cat:"sec",q:"What does this command do?",code:cmd,opts,a};
}
function gSIDRID(r){
  const items=[["S-1-5-18","the Local System (SYSTEM) account"],["S-1-5-19","the Local Service account"],["S-1-5-20","the Network Service account"],["S-1-5-32-544","the built-in Administrators group"],["S-1-5-32-545","the built-in Users group"],["S-1-1-0","Everyone"],["RID 500","the built-in Administrator user"],["RID 501","the built-in Guest account"],["RID 502","the krbtgt (Kerberos ticket-granting) account"],["RID 512","the Domain Admins group"],["RID 513","the Domain Users group"]];
  const [sid,desc]=pick(r,items);
  const q={t:desc,why:`Correct. ${sid} identifies ${desc}.`};
  const ds=shuffle(r,items.filter(x=>x[0]!==sid)).slice(0,3).map(x=>({t:x[1],why:`That is ${x[0]}.`}));
  const {opts,a}=mk(r,q,ds);
  return{cat:"os",q:`In Windows, ${sid.startsWith("RID")?"a SID ending in "+sid:sid} identifies:`,opts,a};
}
GENS.os.push(gWinLogon,gEventID,gNetstatPid,gSIDRID);
GENS.sec.push(gSSHLog,gIptables,gTcpdump,gIptables);

function mapArea(a){return (a==="svc")?"net":a}                 // static-bank tag -> CNT area
function mapGenCat(c){return (c==="netd"||c==="svc")?"net":c}   // engine cat -> CNT area

/* ---- folders (Phase 1) with folder-specific generators to enrich pools ---- */
const FOLDERS=["Network Fundamentals","Enterprise Level Networking","CNA","Security","UNIX","Windows","BASH","PowerShell","Python","Wireless and PA","Mobile OS and Cloud"];
const FOLDERGEN={
 "Network Fundamentals":[gSubnet,gConv,gOffset,gOctal,gHexPort,gOSI,gBitwise],

/* ---- normalize both question sources into one shape ----
   item = {source, q, code, opts:[{t,why?}], a, w?, areaCNT, folder, sub, diff} */
function statItem(q){return{source:"stat",q:q.q,code:q.code||null,opts:q.o.map(t=>({t})),a:q.c,w:q.w,areaCNT:mapArea(q.a),folder:q.f,sub:q.s,diff:q.d}}
function genItem(r,engineCat){const it=genFor(r,engineCat);return{source:"gen",q:it.q,code:it.code||null,opts:it.opts,a:it.a,areaCNT:mapGenCat(it.cat),folder:"Generated drill",sub:it.cat,diff:2}}
function genFrom(r,fnList){const it=fnList[Math.floor(r()*fnList.length)](r);return{source:"gen",q:it.q,code:it.code||null,opts:it.opts,a:it.a,w:it.w,areaCNT:mapGenCat(it.cat),folder:it.folder||"Generated drill",sub:it.sub||it.cat,diff:2}}

/* shuffle an item's option order, keeping the correct index accurate */
function shuffleItem(r,item){
  const order=shuffle(r,item.opts.map((o,i)=>i));
  return Object.assign({},item,{opts:order.map(i=>item.opts[i]),a:order.indexOf(item.a)});
}

/* draw one question for a CNT area (mixes fresh generated + grounded static) */
function drawArea(r,areaKey,sub){
  const a=AREAS.find(x=>x.k===areaKey);
  let statics=BANK.filter(q=>mapArea(q.a)===areaKey);
  if(sub) statics=statics.filter(q=>q.s===sub);
  if(!sub&&window.__building&&r()<0.7){const hard=statics.filter(q=>q.d>=2);if(hard.length>8)statics=hard}
  const canGen=a.gen.length>0 && !sub;              // sub filter -> static only (subs are concept-specific)
  let item;
  if(canGen && (statics.length===0 || r()<0.5)) item=genItem(r,pick(r,a.gen));
  else if(statics.length) item=statItem(pick(r,statics));
  else item=genItem(r,pick(r,a.gen.length?a.gen:["fund"]));
  return shuffleItem(r,item);
}
/* draw one question for a Phase-1 folder */
function drawFolder(r,folders){
  const f=pick(r,folders);
  const statics=BANK.filter(q=>q.f===f);
  const gens=FOLDERGEN[f];
  let item;
  if(gens && (statics.length===0 || r()<0.4)) item=genFrom(r,gens);
  else if(statics.length) item=statItem(pick(r,statics));
  else item=genFrom(r,gens||[gConv]);
  return shuffleItem(r,item);
}

/* ---- weak-spots store (snapshots of missed questions) ---- */
function addWeak(item){const w=jload(WEAK,[]);w.push({q:item.q,code:item.code,opts:item.opts,a:item.a,w:item.w||null,areaCNT:item.areaCNT,folder:item.folder,sub:item.sub});jsave(WEAK,w.slice(-60))}
function weakList(){return jload(WEAK,[])}

/* ---- explanation rendering (works for both sources) ---- */
function explainHTML(item,picked){
  const ok=picked===item.a;
  let h=`<div class="fb ${ok?"correct":"wrong"}"><span class="mk">${ok?"Correct.":"Not quite."}</span> `;
  if(item.source==="gen"){
    if(!ok) h+=`You chose ${L8[picked]}: ${esc(item.opts[picked].why)} `;
    h+=`<b>${L8[item.a]} is correct:</b> ${esc(item.opts[item.a].why)}`;
  }else{
    if(!ok) h+=`You chose ${L8[picked]} (${esc(item.opts[picked].t)}). `;
    h+=`<b>${L8[item.a]} is correct.</b> ${esc(item.w)}`;
  }
  return h+`</div>`;
}

setInterval(()=>{if(PAUSE)return;const el=document.getElementById("clock");if(el&&T&&T.timed)el.textContent=fmt(Math.floor((Date.now()-T.start)/1000))},1000);
function stemKey(it){const o=it.opts?it.opts.map(x=>typeof x==="string"?x:x.t).slice().sort().join("~"):"";return (it.q+"|"+(it.code||"")+"|"+o).trim().toLowerCase()}
function drawUnique(drawFn,r,used,tries){
  tries=tries||60;
  for(let i=0;i<tries;i++){const it=drawFn(r);const k=stemKey(it);if(!used.has(k)){used.add(k);return it}}
  return drawFn(r); // pool exhausted — accept (shouldn't happen at normal lengths)
}
function buildTest(r,n){
  window.__building=true;
  const items=[],used=new Set();
  const phase1Count=Math.round(n*0.12);
  const areaN=n-phase1Count;
  let assigned=0;const order=["fund","net","os","prog","sec"];
  order.forEach((k,i)=>{
    let cnt=(i===order.length-1)?(areaN-assigned):Math.round(areaN*WEIGHTS[k]);assigned+=cnt;
    const st=areaStatics(k).filter(q=>q.d>=2).length>8?areaStatics(k).filter(q=>q.d>=2):areaStatics(k);
    const d=makeDealer(r,st,areaGens(k),{genShare:0.5});
    for(let j=0;j<cnt;j++){let it=null;for(let t=0;t<20;t++){it=d.next();if(it&&!used.has(stemKey(it)))break}if(it){used.add(stemKey(it));items.push(it)}}
  });
  for(let j=0;j<phase1Count;j++)items.push(drawUnique(rr=>drawFolder(rr,BLUEPRINT==="field"&&rr()<0.6?["Windows","Windows","Security","CNA"]:FOLDERS),r,used));

  return shuffle(r,items);
}

/* ================= XP / LEVELS ================= */
const XPKEY="cnab-pro-xp-v1";
function xpLoad(){return jload(XPKEY,{xp:0,steps:{},mstats:{}})}
function xpSave(x){jsave(XPKEY,x)}
function levelFor(xp){let lvl=1,need=120,acc=0;while(xp>=acc+need){acc+=need;lvl++;need=Math.round(120*Math.pow(lvl,1.35))}return{lvl,into:xp-acc,need}}
let LVL_HOLD=false,LVL_PENDING=0;
function awardXP(n,label){
  if(!n)return;const X=xpLoad();const before=levelFor(X.xp).lvl;X.xp=Math.max(0,X.xp+n);xpSave(X);const after=levelFor(X.xp).lvl;
  renderXPBar();toastXP(n,label);if(after>before){if(LVL_HOLD)LVL_PENDING=after;else levelUp(after)}
}
function releaseLevelUp(){LVL_HOLD=false;if(LVL_PENDING){const l=LVL_PENDING;LVL_PENDING=0;levelUp(l)}}
function toastXP(n,label){if(focusOn())return;const t=document.createElement("div");t.className="xptoast "+(n<0?"neg":"");t.textContent=(n>0?"+":"")+n+" XP"+(label?" · "+label:"");document.body.appendChild(t);setTimeout(()=>t.classList.add("show"),10);setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),400)},1600)}
function levelUp(lvl){sfx("levelup");if(typeof buddyCheer==="function")buddyCheer();const o=document.createElement("div");o.className="lvlup";o.innerHTML=`<div class="burst">${Array.from({length:18},(_,i)=>`<i style="--a:${i*20}deg;--d:${(i%3)*60}ms"></i>`).join("")}</div><div class="card"><div class="big">LEVEL ${lvl}</div><div class="sub">Rank: ${esc(rankFor().n)} — ${esc(rankFor().proof)}</div><button class="btn" id="lvok">Continue</button></div>`;document.body.appendChild(o);o.querySelector("#lvok").onclick=()=>o.remove();setTimeout(()=>o.classList.add("show"),20)}
function recordMatrixStat(cat,gate,ok,secs){const X=xpLoad();const k=(gate&&cat!=="hell")?("gate:"+gate):cat;const m=X.mstats[k]||(X.mstats[k]={ok:0,t:0,secs:0});m.t++;if(ok)m.ok++;m.secs+=secs;xpSave(X)}
/* ================= GAME LAYER: gold, backpack, ranks, shop, boss encounters, chest ================= */
const AIDS={elim:{n:"Eliminate",icon:"✂",desc:"Removes one wrong answer (CNT) or two wrong options (matrix).",price:30},reveal:{n:"Reveal",icon:"🔍",desc:"Shows one rule, or highlights which gate is in play.",price:45},time:{n:"Hourglass",icon:"⏳",desc:"Adds 30 seconds to the ring on a timed matrix.",price:25}};
const POWERS={shield:{n:"Shield",icon:"🛡",desc:"Your next wrong answer in a boss fight costs no boss damage lost — one use.",price:80},lucky:{n:"Lucky coin",icon:"🪙",desc:"Doubles gold from correct answers for your next 20 questions.",price:60},magnet:{n:"Boss magnet",icon:"🧲",desc:"Guarantees a boss on your next practice question — once you have at least 5 missed questions for it to use.",price:120}};
function gameLoad(){const X=xpLoad();X.gold=X.gold||0;X.bag=X.bag||{elim:3,reveal:2,time:2};X.pw=X.pw||{};X.miss=X.miss||{};X.badges=X.badges||[];X.bossWins=X.bossWins||0;return X}
function gameSave(X){xpSave(X)}
function bagCount(X){X=X||gameLoad();return Object.values(X.bag).reduce((a,b)=>a+b,0)}
function hasAid(k){return (gameLoad().bag[k]||0)>0}
function useAid(k){const X=gameLoad();if((X.bag[k]||0)<=0)return false;X.bag[k]--;gameSave(X);renderXPBar();return true}
function grantAids(n){const X=gameLoad();const keys=Object.keys(AIDS);const got={};for(let i=0;i<n;i++){const k=keys[Math.floor(Math.random()*keys.length)];X.bag[k]=(X.bag[k]||0)+1;got[k]=(got[k]||0)+1}gameSave(X);renderXPBar();return got}
function awardGold(n,label){if(!n)return;const X=gameLoad();if(n>0&&X.pw.lucky>0){n*=2;X.pw.lucky--;if(X.pw.lucky===0)delete X.pw.lucky}X.gold=Math.max(0,X.gold+n);gameSave(X);renderXPBar();toastGold(n,label)}
function toastGold(n,label){if(focusOn())return;if(n>0)sfx("coin");const t=document.createElement("div");t.className="xptoast gold "+(n<0?"neg":"");t.textContent=(n>0?"+":"")+n+" gold"+(label?" · "+label:"");t.style.top="106px";document.body.appendChild(t);setTimeout(()=>t.classList.add("show"),10);setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),400)},1600)}
/* rank = proven skill, not XP volume */
const RANKS=[
 {n:"Recruit",proof:"Starting out.",test:X=>true},
 {n:"Technician",proof:"Passed Step 2 — can find a single gate under the clock.",test:X=>(X.steps.single||{}).passes>0},
 {n:"Analyst",proof:"Passed Step 4 — everything at the real 60-second pace.",test:X=>(X.steps.full||{}).passes>0},
 {n:"Operator",proof:"Passed the Boss (20 in 20:00) twice.",test:X=>(X.steps.boss||{}).passes>=2},
 {n:"Archdemon",proof:"Cleared HELL — the APM-ceiling set — at 75%.",test:X=>(X.steps.hell||{}).passes>0}
];
function rankFor(X){X=X||gameLoad();let r=RANKS[0];for(const k of RANKS)if(k.test(X))r=k;return r}
function nextRank(X){X=X||gameLoad();const i=RANKS.indexOf(rankFor(X));return RANKS[i+1]||null}
/* track misses by stem so bosses can pull the most-missed */
function noteMiss(item){const X=gameLoad();const k=stemKey(item);const m=X.miss[k]||(X.miss[k]={n:0,item:null});m.n++;m.item={q:item.q,code:item.code||null,opts:item.opts,a:item.a,w:item.w||null,areaCNT:item.areaCNT,source:item.source,diff:item.diff};gameSave(X)}
function mostMissed(n){const X=gameLoad();return Object.values(X.miss).filter(m=>m.item).sort((a,b)=>b.n-a.n).slice(0,n).map(m=>Object.assign({},m.item,{missed:m.n}))}
/* ---- top bar: level, rank, gold, backpack ---- */
function renderXPBar(){const el=document.getElementById("xpbar");if(!el)return;const X=gameLoad();const L=levelFor(X.xp);const R=rankFor(X);el.innerHTML=`<button class="rankbtn" id="rankbtn" title="${esc(R.proof)}"><span class="lv">Lv ${L.lvl}</span><span class="rk">${esc(R.n)}</span></button><span class="track"><i style="width:${Math.round(L.into/L.need*100)}%"></i></span><span class="xpn">${L.into}/${L.need}</span><button class="bagbtn" id="bagbtn" title="Backpack"><span>🎒</span><b>${bagCount(X)}</b></button><span class="goldpill" title="Gold">🪙 ${X.gold}</span>`;el.querySelector("#bagbtn").onclick=()=>show("shop");el.querySelector("#rankbtn").onclick=()=>show("progress")}
/* ---- shop ---- */
function renderShop(){
  const el=document.getElementById("view-shop");const X=gameLoad();const R=rankFor(X),N=nextRank(X);
  const row=(k,d,isPw)=>`<div class="sheet shopitem"><div class="si-icon">${d.icon}</div><div class="si-body"><h3 style="margin:0">${esc(d.n)} <span class="tag">${isPw?(X.pw[k]?"active ×"+X.pw[k]:"power-up"):"in bag: "+(X.bag[k]||0)}</span></h3><p class="small" style="margin:4px 0 0">${esc(d.desc)}</p></div><button class="btn sm" data-buy="${k}" data-pw="${isPw?1:0}" ${X.gold<d.price?"disabled":""}>🪙 ${d.price}</button></div>`;
  el.innerHTML=`<h1>Shop &amp; backpack</h1>
  <div class="row"><div class="sheet" style="flex:1;min-width:150px"><div class="muted small">Gold</div><div class="score" style="font-size:1.8rem">🪙 ${X.gold}</div><div class="small muted">Earned per correct answer; big drops from boss chests.</div></div>
  <div class="sheet" style="flex:1;min-width:150px"><div class="muted small">Rank</div><div class="score" style="font-size:1.5rem">${esc(R.n)}</div><div class="small muted">${esc(R.proof)}${N?`<br><b>Next:</b> ${esc(N.n)} — ${esc(N.proof)}`:""}</div></div>
  <div class="sheet" style="flex:1;min-width:150px"><div class="muted small">Backpack</div><div class="score" style="font-size:1.8rem">🎒 ${bagCount(X)}</div><div class="small muted">${Object.keys(AIDS).map(k=>`${AIDS[k].icon} ${X.bag[k]||0}`).join(" · ")}</div></div></div>
  <h2>Aids</h2><p class="small muted">Use them from the <b>Aids</b> bar on any practice question or matrix. They never work in the Boss step or a review-at-end test — that's where you prove it without help.</p>
  <div class="stack">${Object.entries(AIDS).map(([k,d])=>row(k,d,false)).join("")}</div>
  <h2>Power-ups</h2><div class="stack">${Object.entries(POWERS).map(([k,d])=>row(k,d,true)).join("")}</div>
  <h2>How to earn gold</h2><ul class="small"><li>+2 gold per correct practice answer (+4 for a hard one), +3 per matrix, +1 per gate drill.</li><li>+15 gold for passing a training step.</li><li><b>Boss chests</b>: a spin for one reward — gold, aids, a power-up, or rarely a theme or companion. Bosses have a 15% chance after each practice question (once you have 5+ missed questions), and pull from what you've missed most; a question you beat in a boss fight is retired from future bosses.</li></ul>
  ${cosmeticsShopHTML(cosLoad())}
  ${X.badges.length?`<h2>Badges</h2><div class="chips">${X.badges.map(b=>`<span class="chip" aria-pressed="true">${esc(b)}</span>`).join("")}</div>`:""}`;
  bindCosmetics(el);
  el.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const k=b.dataset.buy,isPw=b.dataset.pw==="1";const d=isPw?POWERS[k]:AIDS[k];const Y=gameLoad();if(Y.gold<d.price)return;Y.gold-=d.price;if(isPw){Y.pw[k]=(Y.pw[k]||0)+(k==="lucky"?20:1)}else Y.bag[k]=(Y.bag[k]||0)+1;gameSave(Y);toastGold(-d.price,d.n);renderXPBar();renderShop()});
}

/* ================= SOUND (Web Audio, synthesized — no files, works offline) ================= */
const SND={ctx:null,vol:0.6,on:true};
function sndInit(){if(SND.ctx)return;try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){SND.ctx=null}}
function sndLoad(){const p=jload(PREF,{});if(p.vol!=null)SND.vol=p.vol;if(p.snd!=null)SND.on=p.snd}
function sndSave(){const p=jload(PREF,{});p.vol=SND.vol;p.snd=SND.on;jsave(PREF,p)}
function tone(f,t0,dur,type,gain,slideTo){const c=SND.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime((gain||0.3)*SND.vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur+0.02)}
function noise(t0,dur,gain){const c=SND.ctx;const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=(gain||0.2)*SND.vol;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=900;s.connect(f).connect(g).connect(c.destination);s.start(t0)}
function sfx(name){
  if(!SND.on||SND.vol<=0)return;sndInit();const c=SND.ctx;if(!c)return;if(c.state==="suspended")c.resume();const t=c.currentTime;
  switch(name){
    case "click":tone(900,t,0.04,"square",0.08);break;
    case "ok":tone(660,t,0.09,"triangle",0.25);tone(990,t+0.09,0.14,"triangle",0.25);break;
    case "bad":tone(200,t,0.18,"sawtooth",0.22,120);noise(t,0.12,0.12);break;
    case "coin":tone(1250,t,0.06,"square",0.18);tone(1700,t+0.06,0.12,"square",0.18);break;
    case "xp":tone(520,t,0.05,"triangle",0.15);break;
    case "levelup":[523,659,784,1046].forEach((f,i)=>tone(f,t+i*0.09,0.22,"triangle",0.3));tone(1568,t+0.4,0.5,"sine",0.25);break;
    case "tick":tone(1400,t,0.025,"square",0.07);break;
    case "spinstop":tone(440,t,0.12,"triangle",0.3);tone(880,t+0.12,0.3,"triangle",0.3);break;
    case "rare":[659,880,1175].forEach((f,i)=>tone(f,t+i*0.1,0.3,"triangle",0.3));break;
    case "epic":[523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*0.08,0.35,"triangle",0.3));noise(t+0.4,0.3,0.08);break;
    case "legendary":[392,523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,t+i*0.07,0.6,"triangle",0.3));tone(2093,t+0.5,1.2,"sine",0.3);noise(t+0.5,0.6,0.15);break;
    case "hit":tone(150,t,0.12,"square",0.3,60);noise(t,0.15,0.3);break;
    case "pause":tone(500,t,0.08,"sine",0.15);tone(350,t+0.08,0.14,"sine",0.15);break;
    case "resume":tone(350,t,0.08,"sine",0.15);tone(500,t+0.08,0.14,"sine",0.15);break;
    case "unlock":tone(784,t,0.1,"triangle",0.25);tone(1046,t+0.1,0.1,"triangle",0.25);tone(1568,t+0.2,0.3,"triangle",0.25);break;
    case "roar":tone(90,t,0.5,"sawtooth",0.35,45);noise(t,0.5,0.35);break;
    case "howl":tone(400,t,0.9,"sine",0.25,700);tone(700,t+0.9,0.6,"sine",0.2,420);break;
    case "quack":tone(600,t,0.08,"sawtooth",0.2,300);tone(600,t+0.12,0.08,"sawtooth",0.2,300);break;
    case "hoot":tone(520,t,0.18,"sine",0.25,380);tone(520,t+0.25,0.22,"sine",0.25,380);break;
    case "beep":tone(1200,t,0.06,"square",0.15);tone(1600,t+0.08,0.06,"square",0.15);tone(2000,t+0.16,0.08,"square",0.15);break;
    case "moan":tone(180,t,0.6,"sawtooth",0.2,120);break;
  }
}

/* ================= CHEST: case-opening spinner. One reward per chest. ================= */
const RARITY={common:{n:"Common",w:60,c:"#9aa7b4"},rare:{n:"Rare",w:27,c:"#378ADD"},epic:{n:"Epic",w:10,c:"#9b5de5"},legendary:{n:"Legendary",w:3,c:"#f5c044"}};
const LEGEND_PET={key:"phoenix",n:"Null Phoenix",sprite:"phoenix"};
function lootTable(X){
  const t=[];
  // common: gold / single aids
  [["gold",20],["gold",35],["gold",50],["gold",65],["aid","elim"],["aid","reveal"],["aid","time"]].forEach(([k,v])=>t.push({r:"common",k,v}));
  [["aids","elim",2],["aids","reveal",2],["aids","time",2]].forEach(a=>t.push({r:"common",k:a[0],v:a[1],n:a[2]}));
  // rare: bigger gold, 3× aids, power-ups
  [["gold",90],["aids","elim",3],["aids","reveal",3],["pw","shield"],["pw","lucky"]].forEach(a=>t.push({r:"rare",k:a[0],v:a[1],n:a[2]}));
  // epic: shop items not yet owned (themes / companions), else magnet or 200 gold
  const owned=new Set([...(X.cos.themes||[]),...(X.cos.buddies||[])]);
  for(const k in THEMES)if(!THEMES[k].legendary&&THEMES[k].price>0&&!owned.has(k))t.push({r:"epic",k:"theme",v:k});
  for(const k in BUDDIES)if(BUDDIES[k].price>0&&!owned.has(k))t.push({r:"epic",k:"buddy",v:k});
  t.push({r:"epic",k:"pw",v:"magnet"});t.push({r:"epic",k:"gold",v:200});
  // legendary: Aurora theme, Null Phoenix companion (once each), else 500 gold
  if(!owned.has("aurora"))t.push({r:"legendary",k:"theme",v:"aurora"});
  if(!owned.has(LEGEND_PET.key))t.push({r:"legendary",k:"buddy",v:LEGEND_PET.key});
  t.push({r:"legendary",k:"gold",v:500});
  return t;
}
function rollLoot(X){
  const t=lootTable(X);const byR={};for(const it of t)(byR[it.r]||(byR[it.r]=[])).push(it);
  const rs=Object.keys(RARITY).filter(r=>byR[r]);const tot=rs.reduce((a,r)=>a+RARITY[r].w,0);let x=Math.random()*tot;let r=rs[rs.length-1];for(const k of rs){x-=RARITY[k].w;if(x<=0){r=k;break}}
  const last=X.lastLoot||"";let pool=byR[r].filter(it=>lootId(it)!==last);if(!pool.length)pool=byR[r];
  return pool[Math.floor(Math.random()*pool.length)];
}
function lootId(it){return it.r+":"+it.k+":"+it.v+":"+(it.n||1)}
function lootLabel(it){
  if(it.k==="gold")return {t:`🪙 ${it.v} gold`,i:"🪙"};
  if(it.k==="aid")return {t:`${AIDS[it.v].icon} ${AIDS[it.v].n}`,i:AIDS[it.v].icon};
  if(it.k==="aids")return {t:`${AIDS[it.v].icon} ${AIDS[it.v].n} ×${it.n}`,i:AIDS[it.v].icon};
  if(it.k==="pw")return {t:`${POWERS[it.v].icon} ${POWERS[it.v].n}`,i:POWERS[it.v].icon};
  if(it.k==="theme")return {t:`🎨 Theme: ${THEMES[it.v].n}`,i:"🎨"};
  if(it.k==="buddy")return {t:`🐾 Companion: ${(BUDDIES[it.v]||LEGEND_PET).n}`,i:"🐾",sprite:(BUDDIES[it.v]||{}).sprite};
  return {t:"?",i:"?"};
}
function grantLoot(it){
  const X=cosLoad();
  if(it.k==="gold"){X.gold+=it.v}
  else if(it.k==="aid"){X.bag[it.v]=(X.bag[it.v]||0)+1}
  else if(it.k==="aids"){X.bag[it.v]=(X.bag[it.v]||0)+it.n}
  else if(it.k==="pw"){X.pw[it.v]=(X.pw[it.v]||0)+(it.v==="lucky"?20:1)}
  else if(it.k==="theme"){if(!X.cos.themes.includes(it.v))X.cos.themes.push(it.v);X.cos.theme=it.v}
  else if(it.k==="buddy"){if(!X.cos.buddies.includes(it.v))X.cos.buddies.push(it.v);X.cos.buddy=it.v}
  X.lastLoot=lootId(it);gameSave(X);renderXPBar();if(it.k==="theme"||it.k==="buddy")applyCosmetics();
}
/* Build a reel of ~40 tiles, land on index 34 (the result), decelerate with easing, tick as tiles pass. */
function renderChestSpin(el,onDone){
  const X=cosLoad();const t=lootTable(X);const result=rollLoot(X);
  const N=40,LAND=34;const reel=[];for(let i=0;i<N;i++){reel.push(i===LAND?result:t[Math.floor(Math.random()*t.length)])}
  el.innerHTML=`<div class="casewrap"><div class="casemark"></div><div class="reel" id="reel">${reel.map(it=>{const L=lootLabel(it);return `<div class="tile r-${it.r}" style="--rc:${RARITY[it.r].c}"><div class="ti">${L.sprite?spriteImg(L.sprite,"idle"):L.i}</div><div class="tn">${esc(L.t)}</div><div class="tr">${RARITY[it.r].n}</div></div>`}).join("")}</div></div><p class="muted small" id="casetip" style="text-align:center">Opening…</p>`;
  const reelEl=el.querySelector("#reel");const TW=136; // tile width + gap
  const jitter=(Math.random()-0.5)*(TW*0.6);const target=LAND*TW+TW/2-el.querySelector(".casewrap").clientWidth/2+jitter;
  const D=5200;const t0=performance.now();let lastIdx=-1;
  const ease=x=>1-Math.pow(1-x,4);
  const step=now=>{const p=Math.min(1,(now-t0)/D);const x=ease(p)*target;reelEl.style.transform=`translateX(${-x}px)`;const idx=Math.floor((x+el.querySelector(".casewrap").clientWidth/2)/TW);if(idx!==lastIdx){lastIdx=idx;sfx("tick")}
    if(p<1)requestAnimationFrame(step);else{sfx("spinstop");{const tp=el.querySelector("#casetip");if(tp)tp.textContent=""}setTimeout(()=>{const tile=reelEl.children[LAND];tile.classList.add("won");sfx(result.r==="legendary"?"legendary":result.r==="epic"?"epic":result.r==="rare"?"rare":"coin");if(result.r==="legendary")document.body.classList.add("legend-flash");if(result.r==="epic"||result.r==="legendary")confetti(result.r==="legendary"?160:80,RARITY[result.r].c);setTimeout(()=>document.body.classList.remove("legend-flash"),1600);grantLoot(result);onDone(result)},250)}};
  requestAnimationFrame(step);
}
